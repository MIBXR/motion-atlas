<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档中心 · Motion Atlas</title>
  <meta name="description" content="使用指南、节奏方法、Prompt 写法、条目结构、渲染管线与全部 Prompt。">
  <link rel="icon" href="site/icons/favicon.svg?v=onion-1" type="image/svg+xml">
  <link rel="stylesheet" href="site/shared/site.css">
  <link rel="stylesheet" href="site/pages/docs/docs.css">

</head>
<body>
  <header id="site-header"></header>
  <main class="docs">
    <aside class="lib-side" id="doc-side" aria-label="文档目录">

      <button class="btn toc-toggle" id="toc-toggle" type="button" aria-controls="toc-panel" aria-expanded="false" aria-label="打开本文目录" hidden>本文目录</button>
      <div class="toc-panel" id="toc-panel">
        <div class="toc-head"><p class="eyebrow">本文目录</p><button class="btn toc-close" id="toc-close" type="button" hidden>关闭</button></div>
        <nav id="toc"></nav>
      </div>
    </aside>
  </main>
  <footer id="site-footer"></footer>
  <script src="data/docs.js"></script>
  <script src="site/shared/site.js"></script>
