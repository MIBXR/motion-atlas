<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>胖橘案卷 · 复古半调案卷</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/index.html"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Case File: Chubby";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 30.0, width: 1920, height: 1080, fps: 30,
        async renderAt(t) { await upstream.render(Math.round(t * 30) / 30); },
      },
      ...{
  "title": "胖橘案卷 · 复古半调案卷",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#f7efd9",
  "accent": "#ff5a87",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 9.0
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "片名"
  },
  {
    "t": 2,
    "label": "指控与惯犯印章"
  },
  {
    "t": 4,
    "label": "嫌疑人档案照"
  },
  {
    "t": 8,
    "label": "罪状一测试重力"
  },
  {
    "t": 12,
    "label": "罪状二凌晨跑酷"
  },
  {
    "t": 16,
    "label": "罪状三周报乱码"
  },
  {
    "t": 20,
    "label": "综上所述"
  },
  {
    "t": 22,
    "label": "无罪释放"
  },
  {
    "t": 24,
    "label": "太可爱了"
  },
  {
    "t": 26,
    "label": "结案与片尾"
  }
]
}
    });
  </script>
</body>
</html>
