<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水墨长卷展台 — Motion Atlas Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room" id="room" aria-label="水墨长卷">
    <svg class="defs" aria-hidden="true" width="0" height="0">
      <defs>
        <filter id="paperTex"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 .09 0"/></filter>
      </defs>
    </svg>
    <div class="scroll" id="scroll">
      <div class="paper" id="paper">
        <svg class="tex" aria-hidden="true"><rect width="100%" height="100%" filter="url(#paperTex)"/></svg>
        <div class="layers" id="layers"></div>
        <div class="mist m1" id="mist1" aria-hidden="true"></div>
        <div class="mist m2" id="mist2" aria-hidden="true"></div>
        <section class="poem" id="poem"><p class="col c1" id="col1"></p><p class="col c2" id="col2"></p><p class="by" id="by"></p><svg class="seal-s" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="3" fill="#b8322a"/><text x="20" y="27" text-anchor="middle" font-size="20" fill="#f6efe0" font-family="KaiTi, STKaiti, serif" id="sealSmall"></text></svg></section>
        <svg class="seal" id="seal" viewBox="0 0 120 120" aria-hidden="true"><rect x="6" y="6" width="108" height="108" rx="8" fill="#b8322a"/><rect x="14" y="14" width="92" height="92" rx="4" fill="none" stroke="#f6efe0" stroke-width="4"/><text x="60" y="56" text-anchor="middle" font-size="40" fill="#f6efe0" font-family="KaiTi, STKaiti, 'Kaiti SC', serif" id="sealA"></text><text x="60" y="98" text-anchor="middle" font-size="40" fill="#f6efe0" font-family="KaiTi, STKaiti, 'Kaiti SC', serif" id="sealB"></text></svg>
        <div class="ink-ring" id="inkRing" aria-hidden="true"></div>
      </div>
      <i class="roller left" id="rollL" aria-hidden="true"></i>
      <i class="roller right" id="rollR" aria-hidden="true"></i>
    </div>
    <nav class="mini" id="mini" aria-label="长卷缩略图"><i class="win" id="win"></i></nav>
    <p class="hint" id="hint">拖动画卷、滚轮或 ←/→ 浏览</p>
  </main>
  <script src="motion-kit.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
