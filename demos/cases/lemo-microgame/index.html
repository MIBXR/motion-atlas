  <title>五秒宇航员 · 微游戏快闪</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/chars.js",
    "film/core/lib.js",
    "film/film.js",
    "film/g_ascii.js",
    "film/g_blue.js",
    "film/g_boss.js",
    "film/g_crayon.js",
    "film/g_ink.js",
    "film/g_pixel.js",
    "film/g_riso.js",
    "film/g_swiss.js",
    "film/glpass.js",
    "film/hud.js",
    "film/index.html",
    "film/lines.json",
    "film/main.js",
    "film/stage.js",
    "film/timeline.js",
    "film/toon.js",
    "film/voices/dur.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Five-Second Astronaut";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    let upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    const framesPerWorker = Math.ceil(Math.round(upstream.DUR * 24) / 3);
    let worker = 0;
    MotionKit.mountFilm({
      film: {
        duration: 59.833333333333336, width: 1920, height: 1080, fps: 24,
        async renderAt(t) {
          const f = Math.round(t * 24), next = Math.floor(f / framesPerWorker);
          if (next !== worker) {
            const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
            frame.src = 'film/index.html';
            await loaded;
            upstream = frame.contentWindow;
            while (upstream.READY !== true) await new Promise(requestAnimationFrame);
            worker = next;
            await upstream.render(worker * framesPerWorker / 24);
          }
          await upstream.render(f / 24);
        },
      },
      ...{
  "title": "五秒宇航员 · 微游戏快闪",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#2a0f5c",
  "accent": "#ffc928",
  "step": "frames",

]
