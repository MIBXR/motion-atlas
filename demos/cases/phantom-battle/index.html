<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>怪盗动势 · 战斗指令与总攻过场 — Motion Atlas Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="战斗演示">
    <div class="shake" id="shake">
      <!-- 战斗场景 -->
      <section class="battle" id="battle">
        <div class="bg-dots" aria-hidden="true"></div>
        <div class="bg-slab" id="slab" aria-hidden="true"></div>
        <div class="bg-stripes" aria-hidden="true"></div>

        <figure class="enemy" id="enemy" aria-hidden="true">
          <svg viewBox="0 0 300 300">
            <path d="M150 20l40 60 70-30-30 80 50 40-70 20 10 80-70-50-70 50 10-80-70-20 50-40-30-80 70 30z" fill="#0b0b0c"/>
            <path d="M95 140c20-30 90-30 110 0-10 40-30 60-55 60s-45-20-55-60z" fill="#f4e7c2"/>
            <path d="M112 150l26 6-26 10zM188 150l-26 6 26 10z" fill="#d7141a"/>
            <path d="M120 186h60" stroke="#0b0b0c" stroke-width="6"/>
          </svg>
          <figcaption class="enemy-tag"><b id="enemyName"></b><small id="enemyLv"></small></figcaption>
          <div class="enemy-hp"><i id="enemyHp"></i></div>
        </figure>

        <div class="hero" id="hero" aria-hidden="true">
          <svg viewBox="0 0 200 320">
            <path d="M100 30c22 0 36 16 36 38s-14 40-36 40-36-18-36-40 14-38 36-38z" fill="#0b0b0c"/>
            <path d="M74 64l52-8-4 14-48 6z" fill="#fff"/><circle cx="112" cy="66" r="3.5" fill="#d7141a"/>
            <path d="M60 112l80-6 30 110-20 100H52L32 216z" fill="#0b0b0c"/>
            <path d="M138 116l52 40-20 10-40-26z" fill="#d7141a"/>
            <path d="M58 118L6 200l18 6 44-62z" fill="#0b0b0c"/>
          </svg>
        </div>

        <ul class="commands" id="commands" aria-label="战斗指令"></ul>
        <p class="cmd-help" id="cmdHelp">W A S D 选择 · ENTER 执行</p>

        <ol class="party" id="party" aria-label="队伍状态"></ol>

        <div class="target" id="target" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M60 6l12 24h-24zM114 60l-24 12V48zM60 114L48 90h24zM6 60l24-12v24z" fill="#fff"/><circle cx="60" cy="60" r="34" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/></svg></div>
        <div class="hitflash" id="hitflash" aria-hidden="true"></div>
        <p class="impact" id="weak" aria-hidden="true"></p>
      </section>

      <!-- 1 MORE 切入 -->
      <section class="cutin" id="cutin" aria-hidden="true">
        <div class="band" id="band">
          <div class="band-red"><div class="speed" id="speed"></div>
            <svg class="eyes" viewBox="0 0 600 160"><path d="M60 92c70-46 170-56 230-20-70 0-150 14-230 20z" fill="#0b0b0c"/><path d="M540 92c-70-46-170-56-230-20 70 0 150 14 230 20z" fill="#0b0b0c"/><circle cx="210" cy="80" r="11" fill="#fff"/><circle cx="390" cy="80" r="11" fill="#fff"/><path d="M40 40l140 20M560 40L420 60" stroke="#0b0b0c" stroke-width="10"/></svg>
          </div>
        </div>
        <p class="ransom big" id="moreText"></p>
      </section>

      <p class="ransom huge" id="holdUp" aria-hidden="true"></p>
      <div class="ask" id="ask" aria-hidden="true"><p class="ransom" id="askTitle"></p><p class="ask-sub" id="askSub"></p><p class="ask-keys">ENTER 确认</p></div>

      <!-- 总攻 -->
      <section class="frenzy" id="frenzy" aria-hidden="true">
        <canvas id="ink" width="1600" height="900"></canvas>
        <p class="frenzy-word" id="frenzyWord"></p>
      </section>

      <!-- 收尾漫画格 -->
      <section class="finish" id="finish" aria-hidden="true">
        <div class="burst" id="burst"></div>
        <div class="panel" id="panel">
          <svg viewBox="0 0 400 520" class="pose"><path d="M210 40c26 0 42 18 42 44s-16 46-42 46-42-20-42-46 16-44 42-44z" fill="#0b0b0c"/><path d="M178 80l64-10-4 16-58 8z" fill="#fff"/><path d="M160 140l100-10 70 120-40 20-40-60 10 240h-60l-20-150-40 150h-60l40-200-60 60-30-30z" fill="#0b0b0c"/><path d="M258 132l120 -60 6 22-110 58z" fill="#d7141a"/></svg>
        </div>
        <p class="ransom finish-text" id="finishText"></p>
        <p class="finish-cn" id="finishCn"></p>
      </section>

      <!-- 结算 -->
      <section class="results" id="results" aria-hidden="true">
        <div class="res-slab" id="resSlab"><p class="res-title">RESULTS</p><dl id="resList"></dl></div>
      </section>

      <!-- 异形遮罩转场 -->
      <svg class="wipe" id="wipe" viewBox="-50 -50 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path id="wipeStar" fill="#0b0b0c"/></svg>
    </div>
  </main>

  <script src="motion-kit.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
