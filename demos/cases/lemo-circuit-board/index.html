<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七毫秒 · 电路板</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/core/lib.js",
    "film/data/subs_en.json",
    "film/index.html",
    "film/src/charger.js",
    "film/src/city.js",
    "film/src/font.js",
    "film/src/geo.js",
    "film/src/hanzi.js",
    "film/src/house.js",
    "film/src/levels.js",
    "film/src/loss.js",
    "film/src/main.js",
    "film/src/palette.js",
    "film/src/parts.js",
    "film/src/post.js",
    "film/src/render.js",
    "film/src/world.js",
    "film/voice/dur.json",
    "film/voice/lines.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Seven Milliseconds";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 59.96666666666667, width: 1920, height: 1080, fps: 30,
        async renderAt(t) { await upstream.render(Math.round(t * 30) / 30); },
      },
      ...{
  "title": "七毫秒 · 电路板",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#05190F",
  "accent": "#D9B25B",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 58.0
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "水坝发电"
  },
  {
    "t": 4.7,
    "label": "交流来回摆"
  },
  {
    "t": 10.1,
    "label": "远送损耗"
  },
  {
    "t": 14.4,
    "label": "进入换流站"
  },
  {
    "t": 19.1,
    "label": "沿直流奔跑"
  },
  {
    "t": 23.5,
    "label": "七毫秒到达"
  },
  {
    "t": 29.6,
    "label": "逐级降压"
  },
  {
    "t": 32.4,
    "label": "插座穿孔"
  },
  {
    "t": 34.6,
    "label": "充电器整流"
  },
  {
    "t": 42.1,
    "label": "同一电路原理"
  },
  {
    "t": 52.9,
    "label": "嵌套电路板拉远"
  },
  {
    "t": 54.5,
    "label": "桌上整板落版"
  }
]
}
    });
  </script>
</body>
</html>
