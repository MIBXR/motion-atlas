<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三十三只 · 印刷长镜头</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/core/lib.js",
    "film/index.html",
    "film/look.js",
    "film/props.js",
    "film/scene.js",
    "film/textures.js",
    "film/timeline.js",
    "film/voice/zh/dur.json",
    "film/world.js",
    "vendor/three@0.170.0/build/three.module.js"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Thirty-Three Cranes";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 60.0, width: 1920, height: 1080, fps: 30,
        async renderAt(t) { await upstream.render(Math.round(t * 30) / 30); },
      },
      ...{
  "title": "三十三只 · 印刷长镜头",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#ede5cd",
  "accent": "#c4332b",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 15.4
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "夜谷俯瞰"
  },
  {
    "t": 5.2,
    "label": "低掠河面"
  },
  {
    "t": 7.5,
    "label": "桥铭与温度"
  },
  {
    "t": 11.3,
    "label": "河中睡鹤"
  },
  {
    "t": 14.1,

]
}

  </script>
