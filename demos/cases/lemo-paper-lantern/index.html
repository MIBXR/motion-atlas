<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>末班夜车 · 纸雕灯影</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/index.html",
    "film/timeline.json",
    "film/src/lib.js",
    "film/src/main.js",
    "film/src/paper.js",
    "film/src/post.js",
    "film/src/shots.js",
    "film/src/stage.js",
    "film/src/world.js",
    "vendor/three@0.170.0/build/three.module.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/Pass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "vendor/three@0.170.0/examples/jsm/shaders/CopyShader.js",
    "vendor/three@0.170.0/examples/jsm/shaders/LuminosityHighPassShader.js"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = 'The Last Night Train';
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: { duration: 51, width: 1920, height: 1080, fps: 30,
        async renderAt(t) { await upstream.render(Math.round(t * 30) / 30); },
      },
      ...{
  "title": "末班夜车 · 纸雕灯影",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#060b22",
  "accent": "#ffc46a",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 9.6
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
    {
      "t": 0,
      "label": "雪山站与高架桥"
    },
    {
      "t": 13.8,
      "label": "林间伴行"
    },
    {
      "t": 22,
      "label": "隧道淡黑"
    },
    {
      "t": 25.75,
      "label": "河谷亮窗"
    },
    {
      "t": 35.4,
      "label": "海崖下摇"
    },
    {
      "t": 40.2,
      "label": "终点灭灯与车票"
    }
  ]
}
    });
  </script>
</body>
</html>
