<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本周 AI 四件事 · 电视新闻包装</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/index.html",
    "film/main.js",
    "assets/europe.json",
    "assets/meta.json",
    "assets/plate_datacenter.jpg",
    "assets/plate_wafer.jpg",
    "assets/plates/plate_datacenter.jpg",
    "assets/plates/plate_wafer.jpg"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "The Week in AI";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 53.5, width: 1920, height: 1080, fps: 30,
        async renderAt(t) { await upstream.render(Math.round(t * 30) / 30); },
      },
      ...{
  "title": "本周 AI 四件事 · 电视新闻包装",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#121417",
  "accent": "#F2CF1D",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 18.4
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "频道片头"
  },
  {
    "t": 1.5,
    "label": "本周串联单"
  },
  {
    "t": 6,
    "label": "模型开放"
  },
  {
    "t": 9,
    "label": "翻牌价格"
  },
  {
    "t": 13,
    "label": "行情阈值"
  },
  {
    "t": 20,
    "label": "芯片股"
  },
  {
    "t": 24,
    "label": "欧盟地图"
  },
  {
    "t": 30.5,
    "label": "讲话引语"
  },
  {
    "t": 35.5,
    "label": "规格卡"
  },
  {
    "t": 45,
    "label": "勾选回顾"
  },
  {
    "t": 47.5,
    "label": "片尾"
  }
]
}
    });
  </script>
</body>
</html>
