<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工业协议 · 设施操作台 — Motion Atlas Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" aria-label="设施操作台">
    <div class="grid-bg" aria-hidden="true"></div>

    <header class="topbar" id="topbar">
      <div class="badge-brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l17 30H3z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 15l7 12H13z" fill="var(--yellow)"/></svg>
        <p><b id="brandCode"></b><small id="brandSite"></small></p>
      </div>
      <nav class="tabs" id="tabs" aria-label="主模块"></nav>
      <dl class="res" id="res"></dl>
    </header>

    <aside class="rail" id="rail" aria-label="子菜单"></aside>

    <section class="content" id="content">
      <div class="view" data-view="aic" id="viewAic">
        <div class="view-head"><p class="kicker">FACTORY · PRODUCTION OVERVIEW</p><h1 class="scr" id="hAic">集成工业 · 产线总览</h1></div>
        <svg class="factory" id="factory" viewBox="0 0 1000 600" aria-label="产线节点图"></svg>
      </div>
      <div class="view" data-view="ops" id="viewOps">
        <div class="view-head"><p class="kicker">OPERATORS · SQUAD 01</p><h1 class="scr" id="hOps">干员 · 编队</h1></div>
        <ul class="op-grid" id="opGrid"></ul>
      </div>
      <div class="view" data-view="depot" id="viewDepot">
        <div class="view-head"><p class="kicker">DEPOT · K7 STORAGE</p><h1 class="scr" id="hDepot">仓储 · 物资</h1></div>
        <ul class="depot" id="depot"></ul>
      </div>
      <div class="view" data-view="mission" id="viewMission">
        <div class="view-head"><p class="kicker">MISSIONS</p><h1 class="scr" id="hMission">任务 · 主线</h1></div>
      </div>
      <i class="scanline" id="scanline" aria-hidden="true"></i>
    </section>

    <aside class="detail" id="detail" aria-live="polite">
      <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
      <p class="kicker"><span id="dCode"></span><span>BLUEPRINT</span></p>
      <h2 class="d-title"><span id="dName"></span><small id="dEn"></small></h2>
      <svg class="blueprint" id="blueprint" viewBox="0 0 320 180" aria-hidden="true"></svg>
      <dl class="stats" id="stats"></dl>
      <button type="button" class="deploy" id="deploy"><i class="fill" id="deployFill"></i><span class="d-label" id="deployLabel">HOLD TO DEPLOY</span><span class="hz" aria-hidden="true"></span></button>
      <p class="stamp" id="stamp">DEPLOYED</p>
    </aside>

    <footer class="status" id="status">
      <span class="hazard" aria-hidden="true"></span>
      <span id="coord">K7 · 41.27N / 117.06E</span>
      <span class="ticker" id="ticker"></span>
      <span id="clock">06:12:04</span>
    </footer>

    <section class="loader" id="loader" aria-hidden="true">
      <svg viewBox="0 0 40 40" class="l-logo"><path d="M20 3l17 30H3z" fill="none" stroke="#1d1f22" stroke-width="3"/><path d="M20 15l7 12H13z" fill="#ffd400"/></svg>
      <p class="l-title scr" id="lTitle"></p>
      <div class="segs" id="segs"></div>
      <p class="l-pct" id="lPct">000%</p>
    </section>
  </main>
  <script src="motion-kit.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
