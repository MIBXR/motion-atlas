<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽卡揭示舞台 — Motion Atlas Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="抽卡揭示">
    <div class="sky" aria-hidden="true"></div>
    <canvas id="fx" width="1600" height="900" aria-hidden="true"></canvas>
    <div class="orb" id="orb" aria-hidden="true"><i class="ring r1"></i><i class="ring r2"></i><i class="core"></i></div>
    <div class="pillar" id="pillar" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <section class="cards" id="cards" aria-label="抽卡结果"></section>
    <header class="top"><p class="title" id="title"></p><p class="count" id="count"></p></header>
    <div class="actions"><button type="button" class="draw" id="draw"><span>DRAW ×10</span><small>十连召唤</small></button><button type="button" class="skip" id="skip">跳过</button></div>
    <p class="sr" id="sr" aria-live="polite"></p>
  </main>
  <script src="motion-kit.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
