<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>买咖啡 · 科幻情景喜剧卡通</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/chars.js",
    "film/core/lib.js",
    "film/index.html",
    "film/lines.json",
    "film/main.js",
    "film/story.js",
    "film/toon.js",
    "film/voices/dur.json",
    "film/voices/lips.json",
    "film/worlds.js"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Coffee Run";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 57.5, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "买咖啡 · 科幻情景喜剧卡通",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#a7c3b1",
  "accent": "#3fd93a",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 11.5
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "空壶冷开场"
  },
  {
    "t": 9.5,
    "label": "开门与片名"
  },
  {
    "t": 12.85,
    "label": "果冻宇宙"
  },
  {
    "t": 20.9,
    "label": "杯子宇宙"
  },
  {
    "t": 28.4,
    "label": "三连跳转"
  },
  {
    "t": 31.4,
    "label": "普通咖啡店"
  },
  {
    "t": 36.05,
    "label": "回到实验室"
  },
  {
    "t": 40.7,
    "label": "无咖啡因反转"
  },
  {
    "t": 44,
    "label": "冷场"
  },
  {
    "t": 49.1,
    "label": "回扣"
  },
  {
    "t": 53,
    "label": "片尾"
  }
]
}
    });
  </script>
</body>
</html>
