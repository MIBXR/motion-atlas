<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月亮睡不着 · 蜡笔儿童绘本</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/chars.js",
    "film/crayon.js",
    "film/end.js",
    "film/film.js",
    "film/gl.js",
    "film/index.html",
    "film/main.js",
    "film/pal.js",
    "film/rig.js",
    "film/world.js",
    "film/core/lib.js"
  ],
  "images": [],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "The Moon Can't Sleep";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 52.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "月亮睡不着 · 蜡笔儿童绘本",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#f4efe3",
  "accent": "#d4483c",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 43.68
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "空纸画入"
  },
  {
    "t": 5.6,
    "label": "推近月亮"
  },
  {
    "t": 8.2,
    "label": "数羊失眠"
  },
  {
    "t": 14.9,
    "label": "沿视线发现"
  },
  {
    "t": 17.6,
    "label": "月亮与女孩"
  },
  {
    "t": 19.8,
    "label": "画梯攀爬"
  },
  {
    "t": 27.1,
    "label": "水彩显星"
  },
  {
    "t": 37.4,
    "label": "入睡收束"
  },
  {
    "t": 44.8,
    "label": "绘本拉远翻页"
  }
]
}
    });
  </script>
</body>
</html>
