<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市之光，1987 · 80 年代赛璐璐动画</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/bg.js",
    "film/cel.js",
    "film/fx.js",
    "film/hands.js",
    "film/head80.js",
    "film/hud.js",
    "film/index.html",
    "film/main.js",
    "film/pal.js",
    "film/post.js",
    "film/rider.js",
    "film/scenes1.js",
    "film/scenes2.js",
    "film/scenes3.js",
    "film/scenes4.js",
    "film/shots.js",
    "film/story.js",
    "film/voices/dur.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "City Lights, 1987";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 59.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "城市之光，1987 · 80 年代赛璐璐动画",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#080b20",
  "accent": "#ff579a",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 17.7
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "多层摇降"
  },
  {
    "t": 4.137931034482759,
    "label": "手中的磁带"
  },
  {

  },

  }
]
}
    });
  </script>
</body>
