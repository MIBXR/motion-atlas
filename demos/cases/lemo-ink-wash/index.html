<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>剑客渡江 · 中国水墨</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/climax.js",
    "film/comp.js",
    "film/core/lib.js",
    "film/cross.js",
    "film/face.js",
    "film/glyph.js",
    "film/hero.js",
    "film/index.html",
    "film/ink.js",
    "film/land.js",
    "film/main.js",
    "film/passage.js",
    "film/seal.js",
    "film/shots.js",
    "film/story.js",
    "film/subs.js",
    "film/voices/dur.json",
    "film/wave.js",
    "film/world.js"
  ],
  "images": [],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "The Swordsman and the River";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 48.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "剑客渡江 · 中国水墨",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#F2ECDE",
  "accent": "#B02E22",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 34.56
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
    {
      "t": 0,
      "label": "虚白落墨"
    },
    {
      "t": 5.6,
      "label": "展开手卷"
    },
    {
      "t": 14.45,
      "label": "轻功渡江"
    },
    {
      "t": 21.3,
      "label": "巨浪压境"
    },
    {
      "t": 26.8,
      "label": "帽檐静默"
    },
    {
      "t": 27.9,
      "label": "以剑写水"
    },
    {
      "t": 30.5,
      "label": "蓄势"
    },
    {
      "t": 32.4,
      "label": "一笔斩浪"
    },
    {
      "t": 35,
      "label": "渡向彼岸"
    },
    {
      "t": 40.4,
      "label": "拱手"
    },
    {
      "t": 42.6,
      "label": "整卷拉远"
    },
    {
      "t": 45.6,
      "label": "画下片尾"
    }
  ]
}
    });
  </script>
</body>
</html>
