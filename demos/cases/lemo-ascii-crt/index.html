<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>静海日志 · ASCII / CRT 终端</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/art.js",
    "film/crt.js",
    "film/index.html",
    "film/lines.json",
    "film/main.js",
    "film/term.js",
    "film/voices/dur.json",
    "film/voices/words.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Tranquility.log";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 59.791666666666664, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "静海日志 · ASCII / CRT 终端",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#000000",
  "accent": "#ffb347",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 50.23
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "显像管唤醒"
  },
  {
    "t": 3,
    "label": "文件名成为日志"
  },
  {
    "t": 8.4,
    "label": "等待与来信"
  },
  {
    "t": 29.6,
    "label": "打出回复"
  },
  {
    "t": 33.6,
    "label": "文字排成地出"
  },
  {
    "t": 40.2,
    "label": "字内日志"
  },
  {
    "t": 52.6,
    "label": "月球房间与关机"
  }
]
}
    });
  </script>
</body>
</html>
