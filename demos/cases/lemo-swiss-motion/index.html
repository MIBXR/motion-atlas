<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海报五则 · 瑞士动态排版</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/ease.js",
    "film/film.js",
    "film/lines.json",
    "film/main.js",
    "film/score.json",
    "film/voices/dur.json",
    "film/voices/words_rel.json",
    "film/index.html"
  ],
  "images": [],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Five Rules for a Poster";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 44.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "海报五则 · 瑞士动态排版",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#EAE9E5",
  "accent": "#E30613",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 31.68
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
    {
      "t": 0,
      "label": "红线开场"
    },
    {
      "t": 4,
      "label": "规则一：网格"
    },
    {
      "t": 8,
      "label": "规则二：字体"
    },
    {
      "t": 12,
      "label": "规则三：留白"
    },
    {
      "t": 16,
      "label": "规则四：对齐"
    },
    {
      "t": 18,
      "label": "音符落格"
    },
    {
      "t": 24,
      "label": "鼓组退出"
    },
    {
      "t": 24.5,
      "label": "例外飞出"
    },
    {
      "t": 26,
      "label": "落地重排"
    },
    {
      "t": 29.25,
      "label": "转为乐谱"
    },
    {
      "t": 30,
      "label": "揭示前呼吸"
    },
    {
      "t": 32,
      "label": "乐谱播放"
    },
    {
      "t": 37,
      "label": "变体墙"
    },
    {
      "t": 39,
      "label": "红线裁切"
    },
    {
      "t": 40,
      "label": "回到主海报"
    }
  ],
  "bpm": 120
}
    });
  </script>
</body>
</html>
