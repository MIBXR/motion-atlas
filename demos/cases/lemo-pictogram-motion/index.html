<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>被落下的伞 · 象形运动图形</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/engine.js",
    "film/film.js",
    "film/index.html",
    "film/voice/cues.js"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Left Behind";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 50.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "被落下的伞 · 象形运动图形",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#24457d",
  "accent": "#f2ba1d",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 9.2
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "雨中开伞"
  },
  {
    "t": 2.5,
    "label": "伞留车内"
  },
  {
    "t": 3.88,
    "label": "雨天转晴"
  },
  {
    "t": 4.5,
    "label": "脚印下车"
  },
  {
    "t": 6.5,
    "label": "被落下的伞"
  },
  {
    "t": 10.5,
    "label": "逐站横移"
  },
  {
    "t": 13.5,
    "label": "一秒一张时钟卡"
  },
  {
    "t": 16.5,
    "label": "终点站"
  },
  {
    "t": 18.5,
    "label": "失物招领"
  },
  {

  {

  },
  {
    "t": 34,
    "label": "拿一把"
  },
  {
    "t": 36.5,
    "label": "伞墙开成纹样"
  },
  {

  },

  }
]
}
    });
  </script>
</body>
</html>
