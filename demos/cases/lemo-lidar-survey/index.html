<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林下的田 · 点云测绘</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [],
  "data": [
    "film/cues.json",
    "film/film.js",
    "film/timeline.js",
    "film/data/facts.json",
    "film/data/profile_C.json",
    "film/assets/raw/build/canopy.bin",
    "film/assets/raw/build/ground.bin",
    "film/assets/raw/build/points.bin",
    "fonts/BarlowCondensed-Light.ttf",
    "fonts/BarlowCondensed-Medium.ttf",
    "fonts/BarlowCondensed-Regular.ttf",
    "fonts/IBMPlexMono-Medium.ttf",
    "fonts/IBMPlexMono-Regular.ttf",
    "fonts/NotoSansSC-sub.woff2",
    "film/index.html",
    "vendor/three@0.170.0/build/three.module.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/MaskPass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/OutputPass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/Pass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/RenderPass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js",
    "vendor/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "vendor/three@0.170.0/examples/jsm/shaders/CopyShader.js",
    "vendor/three@0.170.0/examples/jsm/shaders/LuminosityHighPassShader.js",
    "vendor/three@0.170.0/examples/jsm/shaders/OutputShader.js"
  ],
  "images": [
    "film/assets/raw/build/naip.jpg"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "The Fields Under the Forest";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 40.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "林下的田 · 点云测绘",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#05080A",
  "accent": "#FFB347",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 18.6
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
    {
      "t": 0,
      "label": "夏季航拍"
    },
    {
      "t": 3.75,
      "label": "照片变点云"
    },
    {
      "t": 6.875,
      "label": "回波体积"
    },
    {
      "t": 7.5,
      "label": "地面回波读数"
    },
    {
      "t": 10,
      "label": "切割树冠"
    },
    {
      "t": 13.125,
      "label": "只留地面"
    },
    {
      "t": 14.375,
      "label": "点凝成面"
    },
    {
      "t": 15.625,
      "label": "石墙亮起"
    },
    {
      "t": 20,
      "label": "测量总长"
    },
    {
      "t": 24.375,
      "label": "石墙剖面"
    },
    {
      "t": 28.75,
      "label": "历史比较"
    },
    {
      "t": 33.75,
      "label": "树冠返回"
    },
    {
      "t": 35.9375,
      "label": "片尾"
    }
  ],
  "bpm": 96
}
    });
  </script>
</body>
</html>
