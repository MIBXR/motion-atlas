<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周日骑行 · Risograph 孔版印刷</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/draw.js",
    "film/film.js",
    "film/index.html",
    "film/lines.json",
    "film/main.js",
    "film/rider.js",
    "film/riso.js",
    "film/scenes.js",
    "film/scenes2.js",
    "film/sheet.js",
    "film/core/lib.js",
    "film/voices/dur.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Sunday Ride";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 40.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "周日骑行 · Risograph 孔版印刷",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#f5eedb",
  "accent": "#e64b83",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 28.8
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "车铃特写"
  },
  {
    "t": 2,
    "label": "蓝色街道"
  },
  {
    "t": 8,
    "label": "黄色面包店"
  },
  {
    "t": 16,
    "label": "粉色公园"
  },
  {
    "t": 19,
    "label": "鸽群爆发"
  },
  {
    "t": 21.5,
    "label": "法棍乘客"
  },
  {
    "t": 24,
    "label": "圆盘吞景"
  },
  {
    "t": 26,
    "label": "河边静默与锁版"
  },
  {
    "t": 29,
    "label": "分享面包"
  },
  {
    "t": 32,
    "label": "俯拍拉远到印纸"
  },
  {
    "t": 36,
    "label": "片尾"
  }
]
}
    });
  </script>
</body>
</html>
