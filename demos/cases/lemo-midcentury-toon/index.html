<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>认识皮普 · 50s 扁平卡通</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/content.json",
    "film/core/lib.js",
    "film/engine/chars.js",
    "film/engine/icons.js",
    "film/engine/toon.js",
    "film/film.js",
    "film/index.html",
    "film/main.js",
    "film/voices/dur.json"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Meet Pip";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 40.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "认识皮普 · 50s 扁平卡通",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#F4EAD5",
  "accent": "#D35447",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 3.2
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "开箱亮相"
  },
  {
    "t": 7.2727272727272725,
    "label": "底座靠墙"
  },
  {
    "t": 12.727272727272727,
    "label": "手机配对"
  },
  {
    "t": 18.18181818181818,
    "label": "按下启动"
  },
  {
    "t": 21.818181818181817,
    "label": "路线俯视"
  },
  {
    "t": 27.272727272727273,
    "label": "收好电线"
  },
  {
    "t": 30.909090909090907,
    "label": "三步海报"
  },
  {
    "t": 36.36363636363636,
    "label": "圈收片尾"
  }
]
}
    });
  </script>
</body>
</html>
