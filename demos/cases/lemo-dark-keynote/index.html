<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>思考的空间 · 暗色科技发布</title>
  <style>html,body{margin:0;overflow:hidden}#film{display:block;width:1920px;height:1080px;border:0}</style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    await MotionKit.load.prepare({
  "styles": [
    "fonts/fonts.css"
  ],
  "data": [
    "film/core/lib.js",
    "film/engine.js",
    "film/film.js",
    "film/index.html",
    "film/lines.json",
    "film/main.js",
    "film/timeline.js",
    "film/voices/dur.json",
    "film/world.js"
  ],
  "audio": [
    "audio/film.m4a"
  ]
});
    const frame = document.createElement('iframe');
    frame.id = 'film';
    frame.title = "Room to Think";
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.src = 'film/index.html';
    document.querySelector('#stage').append(frame);
    await loaded;
    const upstream = frame.contentWindow;
    while (upstream.READY !== true) await new Promise(requestAnimationFrame);
    MotionKit.mountFilm({
      film: {
        duration: 42.0, width: 1920, height: 1080, fps: 24,
        async renderAt(t) { await upstream.render(Math.round(t * 24) / 24); },
      },
      ...{
  "title": "思考的空间 · 暗色科技发布",
  "root": "#stage",
  "orients": [
    "landscape"
  ],
  "background": "#0A0B0F",
  "accent": "#B7F34A",
  "step": "frames",
  "start": {
    "t": 0,
    "reduced": 8.4
  },
  "audio": {
    "src": "audio/film.m4a",
    "mime": "audio/mp4"
  },
  "markers": [
  {
    "t": 0,
    "label": "光标与标题"
  },
  {
    "t": 4,
    "label": "连续拉远与累积"
  },
  {
    "t": 12,
    "label": "过载插镜"
  },
  {
    "t": 15,
    "label": "定格静音"
  },
  {
    "t": 16,
    "label": "按下与归格"
  },
  {
    "t": 19.5,
    "label": "光带显出产品"
  },
  {
    "t": 25,
    "label": "一个巨型数字"
  },
  {
    "t": 29.5,
    "label": "逐拍收起"
  },
  {
    "t": 34,
    "label": "回到光标"
  }
]
}
    });
  </script>
</body>
</html>
