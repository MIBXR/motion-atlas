<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>

</head>

  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {

        {
          "caseId": "map-pilgrimage",

          "legacy": true
        },
        {

          "label": "等距城市数据弧线",

        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "机场"
        },
        {
          "t": 0.6,
          "label": "描画"
        },
        {
          "t": 4,

        },
        {

        },

          "t": 10.6,

        },
        {

          "label": "弧线接通"
        },
        {

        },

          "label": "弧线齐备"
        }

      "reduced": 8.6,
      "root": "#stage",
      "fps": 30

    await MotionKit.replay(config);

</body>
</html>
