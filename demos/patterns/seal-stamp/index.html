<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印章落下 — Motion Atlas 巧思</title>
<style>
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2722; }
  .paper { position: absolute; inset: 8vh 8vw; background: #f1ead8; box-shadow: 0 30px 80px rgba(0,0,0,.45); display: grid; place-items: center; cursor: pointer; }
  .paper:focus-visible { outline: 3px solid #b8322a; outline-offset: 4px; }
  .poem { position: absolute; right: 12%; top: 14%; writing-mode: vertical-rl; font: 400 clamp(22px, 4vh, 44px)/1.4 "KaiTi","STKaiti","Kaiti SC",serif; letter-spacing: .2em; color: #2a2723; }
  .seal { position: absolute; width: clamp(80px, 14vh, 150px); pointer-events: none; }
  .ring { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 3px solid #b8322a; pointer-events: none; }
  .shadow { position: absolute; width: clamp(80px, 14vh, 150px); aspect-ratio: 1; border-radius: 8px; background: rgba(0,0,0,.3); filter: blur(10px); pointer-events: none; }
  .hint { position: absolute; left: 50%; bottom: 2vh; transform: translateX(-50%); font: 13px/1 "Microsoft YaHei",sans-serif; color: rgba(241,234,216,.75); }
</style>
</head>
<body>
<div class="paper" id="paper" tabindex="0" role="button" aria-label="在纸上盖章">
  <p class="poem" style="margin:0">坐看云起时</p>
  <div class="shadow" id="shadow" aria-hidden="true"></div>
  <svg class="seal" id="seal" viewBox="0 0 120 120" aria-hidden="true"><rect x="6" y="6" width="108" height="108" rx="8" fill="#b8322a"/><rect x="14" y="14" width="92" height="92" rx="4" fill="none" stroke="#f6efe0" stroke-width="4"/><text x="60" y="56" text-anchor="middle" font-size="40" fill="#f6efe0" font-family="KaiTi, STKaiti, serif">观</text><text x="60" y="98" text-anchor="middle" font-size="40" fill="#f6efe0" font-family="KaiTi, STKaiti, serif">山</text></svg>
  <i class="ring" id="ring" aria-hidden="true"></i>
</div>
<p class="hint">点击纸面任意位置盖章（键盘：回车）</p>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 印章落下 = 抬起（影子变大变淡）→ 按下（1.35→1 回弹，轻微旋转）→ 印泥晕开（一圈红色扩散环）→ 纸面微震 + 低频“咚”。 */
const CONFIG = { at: 0.8, lift: 0.35, press: 0.26, rotate: [-6, -2], ring: 0.8, shake: 6, pos: [0.36, 0.62], duration: 3.2 };
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s), sfx = MK.sound();
let stamp = { t: CONFIG.at, x: CONFIG.pos[0], y: CONFIG.pos[1] };
function render(t) {
  const paper = $('#paper'), W = paper.clientWidth, H = paper.clientHeight;
  const x = stamp.x * W, y = stamp.y * H, s0 = stamp.t;
  const lift = MK.seg(t, s0 - CONFIG.lift, CONFIG.lift, MK.ease.outCubic); // 抬起靠近
  const k = MK.seg(t, s0, CONFIG.press, MK.ease.outBack);
  const seal = $('#seal'), sh = $('#shadow');
  const before = t < s0;
  seal.style.left = `${x}px`; seal.style.top = `${y}px`;
  seal.style.opacity = before ? lift * 0.6 : 1;
  seal.style.transform = `translate(-50%, -50%) rotate(${MK.lerp(CONFIG.rotate[0], CONFIG.rotate[1], MK.clamp(k))}deg) scale(${before ? 1.5 : MK.lerp(1.35, 1, MK.clamp(k, 0, 1.1))})`;
  sh.style.left = `${x}px`; sh.style.top = `${y + 30}px`;
  sh.style.opacity = before ? lift * 0.5 : 0.3 * (1 - MK.seg(t, s0, 0.2));
  sh.style.transform = `translate(-50%, -50%) scale(${before ? 1.4 : 1})`;
  const rk = MK.seg(t, s0 + 0.1, CONFIG.ring, MK.ease.outCubic), ring = $('#ring');
  ring.style.left = `${x}px`; ring.style.top = `${y}px`;
  ring.style.opacity = t >= s0 + 0.1 ? (1 - rk) * 0.6 : 0;
  ring.style.transform = `translate(-50%, -50%) scale(${1 + rk * 16})`;
  const shake = !MK.prefersReducedMotion() && t >= s0 ? CONFIG.shake * Math.exp(-(t - s0) * 14) : 0;
  paper.style.transform = `translate(${Math.sin(t * 80) * shake}px, ${Math.cos(t * 70) * shake}px)`;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.at, label: '落章' }] });
let prev = 0;
tl.on((t, playing) => { if (playing && t > prev && stamp.t > prev && stamp.t <= t) { sfx.tone({ f: 90, d: 0.25, g: 0.35, slide: -40 }); sfx.noise({ d: 0.08, g: 0.12, lp: 1200 }); } if (t < prev) stamp = { t: CONFIG.at, x: CONFIG.pos[0], y: CONFIG.pos[1] }; prev = t; });
function stampAt(cx, cy) { const r = $('#paper').getBoundingClientRect(); stamp = { t: tl.time + CONFIG.lift, x: (cx - r.left) / r.width, y: (cy - r.top) / r.height }; if (!tl.playing) tl.play(); }
$('#paper').addEventListener('click', (e) => stampAt(e.clientX, e.clientY));
$('#paper').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const r = $('#paper').getBoundingClientRect(); stampAt(r.left + r.width * 0.5, r.top + r.height * 0.5); } });
MK.expose(tl);
MK.controls(tl, { sound: sfx, accent: '#b8322a' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
