<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蓄力—预示—爆发 — Motion Atlas 巧思</title>
<style>
  :root { --c: #ffffff; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #2a1f6b, #0b0826 70%); color: #fff; font-family: "Bahnschrift","Segoe UI","Microsoft YaHei",sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orb { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 40px var(--c), inset 0 0 30px var(--c); }
  .orb::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: radial-gradient(circle, #fff, var(--c) 50%, transparent 72%); }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  .pick { position: absolute; left: 16px; bottom: 64px; display: flex; gap: 6px; }
  .pick button { min-height: 38px; padding: 0 14px; border: 2px solid #fff; border-radius: 999px; background: transparent; color: #fff; font: 700 13px/1 inherit; cursor: pointer; }
  .pick button[aria-pressed="true"] { background: #fff; color: #120d3a; }
  .pick button:focus-visible { outline: 3px solid #ffcf4a; outline-offset: 2px; }
  .lbl { position: absolute; right: 18px; top: 18px; font: 700 12px/1.6 "JetBrains Mono",Consolas,monospace; letter-spacing: .14em; text-align: right; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900" aria-hidden="true"></canvas>
<div class="orb" id="orb" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<p class="lbl" id="lbl" aria-live="polite"></p>
<div class="pick" id="pick" role="group" aria-label="稀有度"><button type="button" data-r="3" aria-pressed="false">★3</button><button type="button" data-r="4" aria-pressed="false">★4</button><button type="button" data-r="5" aria-pressed="true">★5（升格）</button></div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 期待感 = 时长 × 不确定性：蓄力越久、粒子越往里收、光球越大；预示色先给答案的一部分；
 * 最高稀有度可以“先给次一级的颜色，再升格”（假动作），最后用最强的闪白与冲击波释放。 */
const CONFIG = {
  rarity: 5, colors: { 3: '#4aa8ff', 4: '#b06bff', 5: '#ffcf4a' },
  press: 0.3, tell: 1.6, upgrade: 2.1, burst: 2.5, duration: 4.4, particles: 140,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s), cv = $('#c'), g = cv.getContext('2d'), sfx = MK.sound();
const parts = Array.from({ length: CONFIG.particles }, (_, i) => { const r = MK.rng(3 + i); return { a: r() * 6.283, r0: 0.3 + r() * 0.55, w: 1.5 + r() * 2.5, s: 0.6 + r() * 1.4, z: 1 + r() * 2.5 }; });
function color(t) {
  if (t < CONFIG.tell) return '#ffffff';
  if (CONFIG.rarity === 5 && t < CONFIG.upgrade) return CONFIG.colors[4];
  return CONFIG.colors[CONFIG.rarity];
}
function render(t) {
  const col = color(t), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2;
  document.documentElement.style.setProperty('--c', col);
  const ch = MK.seg(t, CONFIG.press, CONFIG.burst - CONFIG.press, MK.ease.inCubic), b = t - CONFIG.burst;
  g.clearRect(0, 0, W, H);
  g.fillStyle = col;
  for (const p of parts) {
    let x, y, a = 0.3;
    if (b < 0) { const ang = p.a + (t - CONFIG.press) * p.w * (1 + ch * 3), rr = p.r0 * W * 0.45 * (1 - ch * 0.92); x = cx + Math.cos(ang) * rr; y = cy + Math.sin(ang) * rr * 0.6; a = 0.3 + ch * 0.7; }
    else { const k = MK.ease.outExpo(MK.clamp(b / 1.2)), rr = k * W * 0.6 * p.s; x = cx + Math.cos(p.a) * rr; y = cy + Math.sin(p.a) * rr * 0.7; a = 1 - MK.clamp(b / 1.6); }
    if (a <= 0) continue;
    g.globalAlpha = a; g.beginPath(); g.arc(x, y, p.z, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  if (b >= 0 && b < 0.8) { g.strokeStyle = col; g.lineWidth = 8 * (1 - b / 0.8); g.globalAlpha = 1 - b / 0.8; g.beginPath(); g.ellipse(cx, cy, b * 1400, b * 900, 0, 0, 6.283); g.stroke(); g.globalAlpha = 1; }
  const orb = $('#orb');
  const shake = CONFIG.rarity === 5 && t >= CONFIG.upgrade && t < CONFIG.burst && !MK.prefersReducedMotion() ? Math.sin(t * 90) * 4 : 0;
  orb.style.opacity = t >= CONFIG.press && t < CONFIG.burst ? 1 : 0;
  orb.style.transform = `translate(${shake}px, 0) scale(${0.25 + ch * 1.1 + (CONFIG.rarity === 5 && t >= CONFIG.upgrade ? 0.25 : 0)})`;
  let fl = 0;
  if (t >= CONFIG.tell) fl = Math.max(fl, 0.35 * Math.exp(-(t - CONFIG.tell) * 10));
  if (CONFIG.rarity === 5 && t >= CONFIG.upgrade) fl = Math.max(fl, 0.7 * Math.exp(-(t - CONFIG.upgrade) * 9));
  if (b >= 0) fl = Math.max(fl, Math.exp(-b * 5));
  $('#flash').style.opacity = MK.prefersReducedMotion() ? 0 : fl;
  $('#lbl').innerHTML = t < CONFIG.press ? 'IDLE' : t < CONFIG.tell ? 'CHARGE' : t < CONFIG.burst ? (CONFIG.rarity === 5 && t >= CONFIG.upgrade ? 'TELL · UPGRADE' : 'TELL') : 'RELEASE';
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.press, label: '蓄力' }, { t: CONFIG.tell, label: '预示' }, { t: CONFIG.upgrade, label: '升格' }, { t: CONFIG.burst, label: '爆发' }] });
let prev = 0;
tl.on((t, playing) => {
  if (playing && t > prev && t - prev < 0.5) {
    if (CONFIG.press > prev && CONFIG.press <= t) sfx.tone({ f: 110, d: CONFIG.burst - CONFIG.press, type: 'sawtooth', g: 0.04, slide: 330 });
    if (CONFIG.tell > prev && CONFIG.tell <= t) sfx.tone({ f: 660, d: 0.4, type: 'triangle', g: 0.08 });
    if (CONFIG.rarity === 5 && CONFIG.upgrade > prev && CONFIG.upgrade <= t) sfx.tone({ f: 988, d: 0.5, type: 'triangle', g: 0.1 });
    if (CONFIG.burst > prev && CONFIG.burst <= t) { sfx.noise({ d: 0.6, g: 0.25, lp: 4000 }); sfx.tone({ f: 80, d: 0.5, g: 0.3, slide: -40 }); }
  }
  prev = t;
});
$('#pick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; CONFIG.rarity = Number(b.dataset.r); document.querySelectorAll('#pick button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); tl.seek(0); tl.play(); });
MK.expose(tl);
MK.controls(tl, { sound: sfx, accent: '#ffcf4a' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2.2 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
