<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三段式下三分之一 — Motion Atlas 巧思</title>
<style>
  :root { --navy: #0a1230; --lime: #c6ff3d; --f: "Bahnschrift","DIN Alternate","Segoe UI","Microsoft YaHei",sans-serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 60% 30%, #2a3a7a, #0b1230 60%, #050a1c); color: #fff; font-family: var(--f); }
  .l3 { position: absolute; left: clamp(16px, 5vw, 80px); bottom: 20%; height: clamp(90px, 14vh, 140px); width: min(80vw, 680px); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--lime); transform-origin: 50% 100%; }
  .plate { position: absolute; left: 22px; top: 0; bottom: 0; right: 0; padding: 12px 24px; background: linear-gradient(90deg, var(--navy), rgba(10,18,48,.86)); display: grid; align-content: center; gap: 6px; }
  .tag { margin: 0; font: 700 12px/1 "JetBrains Mono",Consolas,monospace; letter-spacing: .2em; color: var(--lime); }
  .name { margin: 0; font: 800 clamp(26px, 3.4vw, 50px)/1 var(--f); font-style: italic; }
  .role { margin: 0; font: 600 clamp(13px, 1.2vw, 18px)/1 var(--f); letter-spacing: .12em; color: rgba(255,255,255,.78); }
  .chip { position: absolute; right: -10px; top: -14px; padding: 4px 10px; background: #ff2e88; font: 800 12px/1 var(--f); letter-spacing: .16em; font-style: italic; transform: skewX(-12deg); }
</style>
</head>
<body>
<section class="l3" role="status">
  <i class="bar" id="bar" aria-hidden="true"></i>
  <div class="plate" id="plate"><p class="tag" id="tag"></p><p class="name" id="name"></p><p class="role" id="role"></p></div>
  <span class="chip" id="chip">LIVE</span>
</section>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 三段式：① 色条从下向上长出 → ② 底板从色条处向右擦出（斜切尾）→ ③ 文字逐行上浮；离场倒序且更快。
 * 时长全部按拍写（bpm），保证踩在音乐/节目节奏上。 */
const CONFIG = {
  bpm: 120, tag: 'PLAYER CAM', name: 'AURORA KANE', role: 'CAPTAIN · TEAM HELIX',
  inBeat: 1, holdBeats: 6, slant: 28, duration: 5,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s), BT = MK.beats(CONFIG.bpm);
$('#tag').textContent = CONFIG.tag; $('#name').textContent = CONFIG.name; $('#role').textContent = CONFIG.role;
function render(t) {
  const i0 = BT.at(CONFIG.inBeat), o0 = BT.at(CONFIG.inBeat + CONFIG.holdBeats);
  const barK = MK.seg(t, i0, 0.2, MK.ease.outCubic) * (1 - MK.seg(t, o0 + 0.25, 0.18, MK.ease.inCubic));
  const plateK = MK.seg(t, i0 + 0.15, 0.35, MK.ease.snap) * (1 - MK.seg(t, o0 + 0.08, 0.22, MK.ease.exit));
  $('#bar').style.transform = `scaleY(${barK})`;
  $('#plate').style.clipPath = `polygon(0 0, ${plateK * 100}% 0, calc(${plateK * 100}% - ${CONFIG.slant}px) 100%, 0 100%)`;
  ['#tag', '#name', '#role'].forEach((s, i) => { const k = MK.seg(t, i0 + 0.35 + i * 0.08, 0.3, MK.ease.outCubic) * (1 - MK.seg(t, o0, 0.14)); $(s).style.opacity = k; $(s).style.transform = `translateY(${(1 - k) * 14}px)`; });
  const ck = MK.seg(t, i0 + 0.6, 0.25, MK.ease.outBack) * (1 - MK.seg(t, o0, 0.12));
  $('#chip').style.transform = `skewX(-12deg) scale(${ck})`;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: BT.at(CONFIG.inBeat), label: '入场' }, { t: BT.at(CONFIG.inBeat + CONFIG.holdBeats), label: '离场' }] });
MK.expose(tl, { bpm: CONFIG.bpm });
MK.controls(tl, { accent: '#c6ff3d' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
