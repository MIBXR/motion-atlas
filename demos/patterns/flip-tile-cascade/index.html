<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "方片翻牌级联波",
      "segments": [
        {
          "caseId": "mg-bauhaus",
          "label": "几何包豪斯",
          "from": 5.8,
          "to": 8.2
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "几何包豪斯"
        },
        {
          "t": 0.2,
          "label": "方片自转"
        },
        {
          "t": 0.7,
          "label": "对角翻牌"
        },
        {
          "t": 1.2,
          "label": "背面三元"
        },
        {
          "t": 1.3,
          "label": "遮挡复位"
        },
        {
          "t": 1.7,
          "label": "向心归牌"
        },
        {
          "t": 2.2,
          "label": "正面定格"
        }
      ],
      "reduced": 1,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
