<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "拖影帧与多重残像",
      "segments": [
        {
          "caseId": "mg-cel-boil",
          "label": "逐帧线条抖动",
          "from": 0,
          "to": 1.45
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "后撤预备"
        },
        {
          "t": 0.3333333333333333,
          "label": "摩擦划火"
        },
        {
          "t": 0.375,
          "label": "扫掠拖影"
        },
        {
          "t": 0.4166666666666667,
          "label": "多重残像"
        },
        {
          "t": 0.5,
          "label": "点火闪光"
        },
        {
          "t": 0.75,
          "label": "翻转顶点"
        },
        {
          "t": 1,
          "label": "落定摆动"
        }
      ],
      "reduced": 0.4166666666666667,
      "root": "#stage",
      "fps": 24
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
