<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>警示横幅与改道 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #f2efe8; --ink: #16171a; --alert: #e5483b; --accent: #d9632b; --ok: #2f9e6b; --pad: clamp(16px, 4vw, 60px);
    --f-mono: "JetBrains Mono","Cascadia Mono",Consolas,monospace; --f-display: "Bahnschrift","DIN Alternate","Segoe UI",sans-serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid { stroke: rgba(22,23,26,.07); } .water { fill: #c9d6df; }
  .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .flash { position: absolute; inset: 0; background: var(--alert); pointer-events: none; opacity: 0; mix-blend-mode: multiply; }
  .alert { position: absolute; left: 0; right: 0; top: clamp(40px, 10vh, 100px); pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px var(--pad); background: var(--alert); color: #fff;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px); }
  .bar svg { width: 22px; height: 22px; }
  .bar b { font: 700 clamp(16px, 1.8vw, 26px)/1 var(--f-display); letter-spacing: .14em; }
  .bar span { font: 12px/1.3 var(--f-mono); letter-spacing: .1em; }
  .chip { display: inline-flex; align-items: center; gap: 8px; margin: 14px var(--pad); padding: 8px 14px; border-radius: 5px; background: var(--ink); color: #fff; font: 700 12px/1 var(--f-mono); letter-spacing: .2em; }
  .chip svg { width: 16px; height: 16px; }
  .chip.ok { background: var(--ok); }
</style>
</head>
<body>
<svg class="map" id="map" aria-hidden="true"></svg>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="alert" id="alert" role="status" aria-live="assertive">
  <div class="bar" id="bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 17.6v.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b id="title"></b><span id="detail"></span></div>
  <span class="chip" id="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="chipIcon" fill="currentColor"/></svg><span id="chipText"></span></span>
</div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 ===== */
const CONFIG = {
  title: 'WRONG TRAIN', detail: 'G7215 · boarded at Suzhou · heading west to Nanjing',
  chip: 'REROUTING', okChip: 'BACK ON ROUTE',
  tAlert: 1.2, tWrong: [0.2, 1.4], tFix: [3.4, 5.4], tClear: 5.6, duration: 8,
  wipe: 0.38, flash: 0.35,
};
/* ================================== */
const MK = MotionKit, NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('map'), $ = (s) => document.querySelector(s);
const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
const grid = mk('path', { class: 'grid' }), water = mk('path', { class: 'water' });
const done = mk('path', { class: 'line', stroke: '#16171a', 'stroke-width': 3 });
const wrong = mk('path', { class: 'line', stroke: '#e5483b', 'stroke-width': 4.5 });
const fix = mk('path', { class: 'line', stroke: '#d9632b', 'stroke-width': 4.5 });
const x = mk('path', { class: 'line', stroke: '#e5483b', 'stroke-width': 3.5 });
const here = mk('circle', { r: 7, fill: '#fff', stroke: '#16171a', 'stroke-width': 3 });
const cut = (pts, p) => { const n = Math.max(1, Math.round(p * (pts.length - 1))); return pts.slice(0, n + 1); };
const sample = (a, b, c, n = 50) => Array.from({ length: n + 1 }, (_, i) => { const k = i / n, u = 1 - k; return [u * u * a[0] + 2 * u * k * b[0] + k * k * c[0], u * u * a[1] + 2 * u * k * b[1] + k * k * c[1]]; });
const d = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
function render(t) {
  const w = innerWidth, h = innerHeight;
  let g = ''; for (let i = 0; i < w; i += 64) g += `M${i} 0V${h}`; for (let i = 0; i < h; i += 64) g += `M0 ${i}H${w}`;
  grid.setAttribute('d', g);
  water.setAttribute('d', `M${w * 0.7} ${h}C${w * 0.72} ${h * 0.6} ${w * 0.9} ${h * 0.5} ${w} ${h * 0.45}V${h}Z`);
  const S = [w * 0.48, h * 0.62];
  done.setAttribute('d', d(sample([w * 0.15, h * 0.9], [w * 0.3, h * 0.6], S)));
  const wrongPts = sample(S, [w * 0.36, h * 0.48], [w * 0.22, h * 0.42]);
  const fixPts = sample(S, [w * 0.66, h * 0.5], [w * 0.86, h * 0.36]);
  const pw = MK.seg(t, CONFIG.tWrong[0], CONFIG.tWrong[1] - CONFIG.tWrong[0], MK.ease.inOutQuad);
  wrong.setAttribute('d', t >= CONFIG.tWrong[0] ? d(cut(wrongPts, pw)) : '');
  wrong.style.opacity = 1 - 0.65 * MK.seg(t, CONFIG.tClear, 0.6);
  const end = wrongPts[wrongPts.length - 1], xk = MK.seg(t, CONFIG.tWrong[1], 0.3, MK.ease.outBack);
  x.setAttribute('d', `M${end[0] - 8} ${end[1] - 8}L${end[0] + 8} ${end[1] + 8}M${end[0] + 8} ${end[1] - 8}L${end[0] - 8} ${end[1] + 8}`);
  x.style.opacity = MK.clamp(xk) * wrong.style.opacity;
  const pf = MK.seg(t, CONFIG.tFix[0], CONFIG.tFix[1] - CONFIG.tFix[0], MK.ease.inOutQuad);
  fix.setAttribute('d', t >= CONFIG.tFix[0] ? d(cut(fixPts, pf)) : '');
  here.setAttribute('cx', S[0]); here.setAttribute('cy', S[1]);
  // 横幅：从左擦入；警示期间红色闪一下；结束时换成“已回到路线”
  const a = CONFIG.tAlert, out = MK.seg(t, CONFIG.tClear + 1.2, 0.35);
  $('#alert').style.opacity = t >= a - 0.01 ? 1 - out : 0;
  $('#bar').style.clipPath = `inset(0 ${(1 - MK.seg(t, a, CONFIG.wipe, MK.ease.outCubic)) * 100}% 0 0)`;
  $('#title').textContent = CONFIG.title;
  $('#detail').textContent = MK.typeText(CONFIG.detail, MK.seg(t, a + 0.3, 0.9, MK.ease.linear));
  $('#flash').style.opacity = t >= a ? 0.18 * Math.exp(-(t - a) / CONFIG.flash * 3) : 0;
  const chip = $('#chip'), ok = t >= CONFIG.tClear;
  chip.classList.toggle('ok', ok);
  chip.style.opacity = MK.seg(t, a + 0.55, 0.25);
  chip.style.transform = `translateX(${(1 - MK.seg(t, a + 0.55, 0.3, MK.ease.outCubic)) * -16}px) scale(${ok ? 1 + 0.08 * Math.exp(-(t - CONFIG.tClear) * 8) : 1})`;
  $('#chipIcon').setAttribute('d', ok ? 'M5 12.5l4.5 4.5L19 7.5l-1.5-1.5-8 8-3-3z' : 'M11 6l-7 6 7 6zM20 6l-7 6 7 6z');
  $('#chipText').textContent = ok ? CONFIG.okChip : CONFIG.chip + '.'.repeat(Math.max(0, Math.floor((t - a) * 3)) % 4);
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.tAlert, label: '警示' }, { t: CONFIG.tFix[0], label: '改道' }, { t: CONFIG.tClear, label: '恢复' }] });
MK.expose(tl);
MK.controls(tl);
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 3 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
addEventListener('resize', () => tl.seek(tl.time));
</script>
</body>
</html>
