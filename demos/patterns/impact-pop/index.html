<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冲击字弹出 — Motion Atlas 巧思</title>
<style>
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0c; font-family: "Arial Black",Impact,sans-serif; }
  .scene { position: absolute; inset: -30px; background: linear-gradient(160deg, #d7141a 0 48%, #0b0b0c 48%); }
  .target { position: absolute; left: 58%; top: 34%; width: min(22vw, 300px); aspect-ratio: 1; }
  .target svg { width: 100%; }
  .burst { position: absolute; left: 0; top: 0; width: 260px; height: 260px; margin: -130px; }
  .word { position: absolute; left: 0; top: 0; margin: 0; white-space: nowrap; font-size: clamp(56px, 8vw, 130px); line-height: 1; color: #fff; -webkit-text-stroke: 5px #0b0b0c; paint-order: stroke fill; text-shadow: 8px 8px 0 #0b0b0c; }
  .word.crit { color: #ffd23f; }
  .flash { position: absolute; inset: 0; background: #fff; mix-blend-mode: difference; pointer-events: none; }
  button { position: absolute; left: 24px; bottom: 70px; min-height: 44px; padding: 0 18px; border: 0; background: #fff; color: #0b0b0c; font: 900 15px/1 "Arial Black",sans-serif; cursor: pointer; }
  button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="target" id="target" aria-hidden="true"><svg viewBox="0 0 300 300"><path d="M150 20l40 60 70-30-30 80 50 40-70 20 10 80-70-50-70 50 10-80-70-20 50-40-30-80 70 30z" fill="#0b0b0c" stroke="#fff" stroke-width="6"/><path d="M95 140c20-30 90-30 110 0-10 40-30 60-55 60s-45-20-55-60z" fill="#f4e7c2"/></svg></div>
  <svg class="burst" id="burst" viewBox="-130 -130 260 260" aria-hidden="true"><path id="burstPath" fill="#fff"/></svg>
  <p class="word" id="word" role="status"></p>
  <div class="flash" id="flash" aria-hidden="true"></div>
</div>
<button type="button" id="hit">再打一下</button>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 命中瞬间：反色闪 60ms + 目标后坐 + 屏幕抖动；随后文字从 2.6 倍以回弹缩到 1、倾斜 −10°，背后一圈星芒爆开。 */
const CONFIG = {
  hits: [{ t: 0.4, word: 'WEAK' }, { t: 1.8, word: 'CRITICAL', crit: true }, { t: 3.2, word: 'TECHNICAL' }],
  popDelay: 0.08, popDur: 0.26, from: 2.6, tilt: -10, hold: 0.9, shake: 22, recoil: 40, burstSpikes: 14, duration: 4.6,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
let extra = [];
const spikes = (n, r1, r2) => { let d = ''; for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, r = i % 2 ? r2 : r1; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r).toFixed(1)}`; } return d + 'Z'; };
function render(t) {
  const hits = [...CONFIG.hits, ...extra].filter((h) => t >= h.t).sort((a, b) => a.t - b.t);
  const h = hits[hits.length - 1];
  const tr = $('#target').getBoundingClientRect();
  const cx = tr.left + tr.width / 2 + 30, cy = tr.top + tr.height / 2 + 30;
  let shake = 0;
  for (const x of hits) shake += CONFIG.shake * Math.exp(-(t - x.t) * 12);
  if (MK.prefersReducedMotion()) shake = 0;
  $('#scene').style.transform = `translate(${Math.sin(t * 93) * shake}px, ${Math.cos(t * 71) * shake}px)`;
  const since = h ? t - h.t : 9;
  $('#flash').style.opacity = since < 0.06 ? 1 : 0;
  $('#target').style.transform = `translateX(${CONFIG.recoil * Math.exp(-since * 6)}px) rotate(${8 * Math.exp(-since * 6)}deg)`;
  $('#target').style.filter = since < 0.1 ? 'brightness(3)' : 'none';
  const w = $('#word');
  const k = MK.seg(since, CONFIG.popDelay, CONFIG.popDur, MK.ease.outBack);
  const out = MK.seg(since, CONFIG.popDelay + CONFIG.popDur + CONFIG.hold, 0.18, MK.ease.inCubic);
  w.textContent = h ? h.word : '';
  w.classList.toggle('crit', !!(h && h.crit));
  w.style.opacity = MK.clamp(k * 3) * (1 - out);
  w.style.transform = `translate(${cx - 30 - tr.width * 0.9}px, ${cy - 30 + tr.height * 0.18}px) rotate(${CONFIG.tilt * (1 + (1 - MK.clamp(k)) * 2)}deg) scale(${MK.lerp(CONFIG.from, 1, MK.clamp(k, 0, 1.15)) * (1 + out * 0.3)})`;
  const bk = MK.seg(since, 0.02, 0.3, MK.ease.outExpo);
  $('#burstPath').setAttribute('d', spikes(CONFIG.burstSpikes, 40 + bk * 90, 20 + bk * 40));
  $('#burst').style.transform = `translate(${cx - 30}px, ${cy - 30}px) rotate(${since * 60}deg)`;
  $('#burst').style.opacity = (1 - MK.seg(since, 0.15, 0.25)) * (since < 1 ? 1 : 0);
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.hits.map((h) => ({ t: h.t, label: h.word })) });
tl.on((t) => { if (t < 0.05) extra = []; });
$('#hit').addEventListener('click', () => { extra.push({ t: tl.time, word: ['WEAK', 'CRITICAL', 'TECHNICAL'][extra.length % 3], crit: extra.length % 3 === 1 }); if (!tl.playing) tl.play(); });
MK.expose(tl);
MK.controls(tl, { accent: '#d7141a' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2.3 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
addEventListener('resize', () => tl.seek(tl.time));
</script>
</body>
</html>
