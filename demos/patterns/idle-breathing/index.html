<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空闲呼吸 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #eae5e1; --ink: #171713; --muted: #77756d; --accent: #c8742f; --f: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; --f-mono: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--f); }
  .stage { position: absolute; inset: 0; display: grid; place-content: center; gap: 40px; padding: 24px; }
  .cards { display: flex; gap: clamp(8px, 1.4vw, 18px); align-items: flex-end; height: 240px; }
  .card { width: clamp(34px, 5vw, 72px); height: 170px; border-radius: 6px; background: linear-gradient(180deg, #f6f3ee, #e2dcd3); box-shadow: 0 14px 30px rgba(80,70,55,.12), inset 0 0 0 1px rgba(255,255,255,.7); }
  .card.sel { box-shadow: 0 14px 30px rgba(80,70,55,.18), inset 0 3px 0 var(--accent); }
  .meter { display: grid; gap: 10px; font: 12px/1.4 var(--f-mono); letter-spacing: .08em; color: var(--muted); }
  .track { position: relative; height: 4px; background: #d6d0c6; width: min(70vw, 620px); }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .track b { position: absolute; top: -6px; width: 2px; height: 16px; background: var(--accent); }
  canvas { width: min(70vw, 620px); height: 90px; }
  button { justify-self: start; min-height: 40px; padding: 0 16px; border: 1px solid var(--ink); background: transparent; font: 600 13px/1 var(--f-mono); cursor: pointer; }
  button:hover { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="stage">
  <div class="cards" id="cards" aria-hidden="true"></div>
  <div class="meter"><span id="label" aria-live="polite"></span><div class="track"><i id="idleBar"></i><b id="thresh"></b></div><canvas id="wave" width="620" height="90" aria-label="两个周期叠加的呼吸曲线"></canvas></div>
  <button type="button" id="poke">模拟一次操作</button>
</main>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 停止操作 idleAfter 秒后，呼吸在 fadeIn 秒内渐入；两个不成整数比的周期叠加，让节奏不机械；
 * 相邻元素错相；任何操作立即渐退。 */
const CONFIG = { count: 9, idleAfter: 2.5, fadeIn: 1.5, fadeOut: 0.3, periods: [8, 13], weights: [0.6, 0.4], amp: 14, phase: [1.3, 0.7], inputs: [0.2, 9.5], duration: 16 };
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
$('#cards').innerHTML = Array.from({ length: CONFIG.count }, (_, i) => `<div class="card${i === 4 ? ' sel' : ''}"></div>`).join('');
const cards = [...document.querySelectorAll('.card')];
let extra = [];
const g = $('#wave').getContext('2d');
const breath = (t, i) => CONFIG.weights[0] * Math.sin((2 * Math.PI * t) / CONFIG.periods[0] + i * CONFIG.phase[0]) + CONFIG.weights[1] * Math.sin((2 * Math.PI * t) / CONFIG.periods[1] + i * CONFIG.phase[1]);
function render(t) {
  const inputs = [...CONFIG.inputs, ...extra].filter((x) => x <= t);
  const last = inputs.length ? Math.max(...inputs) : -99;
  const idle = t - last;
  // 渐入：空闲超过阈值后线性升到 1；渐退：输入后 fadeOut 秒内降到 0
  const on = MK.prefersReducedMotion() ? 0 : MK.clamp((idle - CONFIG.idleAfter) / CONFIG.fadeIn);
  cards.forEach((c, i) => { c.style.transform = `translateY(${(-on * CONFIG.amp * breath(t, i)).toFixed(2)}px)`; });
  $('#label').textContent = on > 0 ? `IDLE ${idle.toFixed(1)} s · 呼吸强度 ${(on * 100).toFixed(0)}%` : `ACTIVE · 距上次操作 ${Math.max(0, idle).toFixed(1)} s`;
  $('#idleBar').style.width = `${MK.clamp(idle / (CONFIG.idleAfter + CONFIG.fadeIn)) * 100}%`;
  $('#thresh').style.left = `${(CONFIG.idleAfter / (CONFIG.idleAfter + CONFIG.fadeIn)) * 100}%`;
  // 曲线：两周期叠加的形状（灰）与当前时刻（橙点）
  g.clearRect(0, 0, 620, 90);
  g.strokeStyle = '#bdb8ad'; g.lineWidth = 1.5; g.beginPath();
  for (let x = 0; x <= 620; x += 4) { const tt = t - 6 + (x / 620) * 12; g.lineTo(x, 45 - breath(tt, 4) * 34); }
  g.stroke();
  g.fillStyle = '#c8742f'; g.beginPath(); g.arc(310, 45 - breath(t, 4) * 34, 5, 0, Math.PI * 2); g.fill();
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.inputs[0], label: '操作' }, { t: CONFIG.inputs[0] + CONFIG.idleAfter, label: '进入空闲' }, { t: CONFIG.inputs[1], label: '操作打断' }] });
tl.on((t) => { if (t < 0.05) extra = []; });
$('#poke').addEventListener('click', () => { extra.push(tl.time); if (!tl.playing) tl.play(); });
MK.expose(tl);
MK.controls(tl, { accent: '#c8742f' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 0.3 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
