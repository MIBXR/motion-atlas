<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档案阵列</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eae5e1;font-family:MiSans,sans-serif}
#array{position:absolute;left:50%;top:50%;transform-origin:center;isolation:isolate;overflow:hidden;background:#e8e5e1}
.scene-atmosphere{z-index:1;transition:none}
canvas{display:block}
</style>
<script type="module">
const load=parent.MotionKit.load, url=p=>new URL(p,document.baseURI).href;
addEventListener('unhandledrejection',event=>load.fail(event.reason));
const fonts=[['400','regular'],['700','bold']].map(([weight,dir])=>({weight,src:url(`../../../cases/archive-os/film/app/fonts/misans-webfont-4.3.1/${dir}/0.woff2`)}));
load.register(['atmosphere.css','runtime.js'].map(url).concat(fonts.map(font=>font.src)));
const faces=await Promise.all(fonts.map(async font=>{
  const data=await (await load.fetch(font.src)).arrayBuffer();
  return load.decode(async()=>{const face=new FontFace('MiSans',data,{weight:font.weight,style:'normal',display:'swap'});await face.load();return face;});
}));
faces.forEach(face=>document.fonts.add(face));
await load.stylesheet(url('atmosphere.css'),{document,before:document.head.querySelector("style")});
await import(await load.moduleURL(url('runtime.js')));
</script>
</head>
<body><main id="array" data-boot="done"><div class="scene-atmosphere archive-atmosphere"></div></main></body>
</html>
