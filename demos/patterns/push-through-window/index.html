<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "穿窗推镜",
      "segments": [
        {
          "caseId": "mg-flat-vector",
          "label": "扁平矢量",
          "from": 2.6666666666666665,
          "to": 5.533333333333333
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "主窗入口"
        },
        {
          "t": 0.20000000000000018,
          "label": "预备拉回"
        },
        {
          "t": 0.3333333333333335,
          "label": "连续推镜"
        },
        {
          "t": 0.7333333333333334,
          "label": "放射速度条"
        },
        {
          "t": 0.8333333333333335,
          "label": "穿窗闪白"
        },
        {
          "t": 1.0666666666666669,
          "label": "到达镜震"
        },
        {
          "t": 1.166666666666667,
          "label": "室内续推"
        }
      ],
      "reduced": 1.3333333333333335,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
