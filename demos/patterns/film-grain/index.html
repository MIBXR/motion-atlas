<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "可复现的胶片颗粒与暗角",
      "orients": [
        "landscape",
        "portrait"
      ],
      "segments": [
        {
          "caseId": "map-pilgrimage",
          "label": "地图巡礼",
          "source": "original.html",
          "from": 0,
          "to": 7.5,
          "legacy": true
        },
        {
          "caseId": "mg-bauhaus",
          "label": "几何包豪斯",
          "from": 0,
          "to": 10
        },
        {
          "caseId": "mg-line-art",
          "label": "线条艺术",
          "from": 0,
          "to": 10
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "地图上的颗粒"
        },
        {
          "t": 2.5,
          "label": "照片颗粒"
        },
        {
          "t": 5,
          "label": "插画颗粒"
        },
        {
          "t": 7.5,
          "label": "几何包豪斯"
        },
        {
          "t": 17.5,
          "label": "线条艺术"
        }
      ],
      "reduced": 1.2,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
