<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斜切指令菜单 — Motion Atlas 巧思</title>
<style>
  :root { --red: #d7141a; --black: #0b0b0c; --white: #fff; --f: "Arial Black","Bahnschrift",Impact,"Segoe UI","Microsoft YaHei",sans-serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--red); font-family: var(--f); }
  .bg { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,0,0,.25) 1.6px, transparent 2.2px); background-size: 14px 14px; }
  .slab { position: absolute; left: -20%; right: -20%; top: 30%; height: 60%; background: var(--black); transform: rotate(-12deg); }
  nav { position: absolute; left: clamp(20px, 10vw, 180px); top: 50%; transform: translateY(-50%); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(10px, 2vh, 22px); }
  li { position: relative; }
  button { all: unset; cursor: pointer; position: relative; display: inline-flex; align-items: center; gap: 14px; padding: 12px 34px 12px 18px; transform-origin: 0 50%; }
  button:focus-visible { outline: 3px solid var(--white); outline-offset: 6px; }
  .plate, .shadow { position: absolute; inset: 0; clip-path: polygon(4% 0, 100% 10%, 96% 100%, 0 88%); }
  .plate { background: var(--white); }
  .shadow { background: var(--black); transform: translate(10px, 8px); }
  .label { position: relative; font: 900 clamp(26px, 4.4vw, 64px)/1 var(--f); color: var(--black); letter-spacing: -.01em; }
  .cn { position: relative; font: 800 13px/1 "PingFang SC","Microsoft YaHei",sans-serif; color: var(--black); opacity: .7; }
  li.on .plate { background: var(--black); } li.on .shadow { background: var(--white); }
  li.on .label, li.on .cn { color: var(--white); }
  .hint { position: absolute; right: 24px; bottom: 70px; font: 700 12px/1.6 "JetBrains Mono","Cascadia Mono",Consolas,monospace; color: rgba(255,255,255,.85); letter-spacing: .12em; text-align: right; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="slab" aria-hidden="true"></div>
<nav aria-label="菜单"><ul id="menu"></ul></nav>
<p class="hint">↑↓ / 悬停 选择<br>选中项放大 · 扭转 · 影子抖动</p>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 ===== */
const CONFIG = {
  items: [{ label: 'SKILL', cn: '技能' }, { label: 'ITEM', cn: '道具' }, { label: 'PERSONA', cn: '人格面具' }, { label: 'STATUS', cn: '状态' }, { label: 'CONFIG', cn: '设置' }],
  baseRotate: [-4, 2, -2, 3, -5],  // 每项静止角度（错落感）
  selScale: 1.18, selRotate: -7, selShift: 26, // 选中：放大、扭转、右移（px）
  snap: 0.16,                     // 切换动画（秒），用 snap 缓动
  jitter: [3, 31, 27],           // 影子抖动幅度（px）与两轴频率
  cursor: [{ t: 0.3, i: 0 }, { t: 1.1, i: 1 }, { t: 1.9, i: 2 }, { t: 2.7, i: 4 }, { t: 3.6, i: 3 }],
  duration: 5,
};
/* ================================== */
const MK = MotionKit, menu = document.getElementById('menu');
menu.innerHTML = CONFIG.items.map((it, i) => `<li data-i="${i}"><button type="button"><i class="shadow"></i><i class="plate"></i><span class="label">${it.label}</span><span class="cn">${it.cn}</span></button></li>`).join('');
const lis = [...menu.children];
let user = null; // { i, t } 用户选择覆盖自动演示
function cursorAt(t) {
  let cur = { i: 0, t: 0, prev: 0 };
  for (const c of CONFIG.cursor) if (t >= c.t) cur = { i: c.i, t: c.t, prev: cur.i };
  return user ? user : cur;
}
function render(t) {
  const c = cursorAt(t);
  const now = user ? performance.now() / 1000 : t;
  const k = MK.seg(now, c.t, CONFIG.snap, MK.ease.snap);
  lis.forEach((li, i) => {
    const on = i === c.i, was = i === c.prev;
    const amt = on ? k : was ? 1 - k : 0;
    const btn = li.querySelector('button');
    btn.style.transform = `translateX(${amt * CONFIG.selShift}px) rotate(${CONFIG.baseRotate[i] + amt * CONFIG.selRotate}deg) scale(${1 + amt * (CONFIG.selScale - 1)})`;
    li.classList.toggle('on', on);
    li.style.zIndex = on ? 2 : 1;
    const [a, fx, fy] = CONFIG.jitter;
    li.querySelector('.shadow').style.transform = on && !MK.prefersReducedMotion() ? `translate(${10 + Math.sin(now * fx) * a}px, ${8 + Math.cos(now * fy) * a}px)` : 'translate(10px, 8px)';
  });
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.cursor.map((c) => ({ t: c.t, label: CONFIG.items[c.i].label })) });
// 用户输入：切到实时，抖动持续
let raf = 0;
function live() { render(tl.time); raf = requestAnimationFrame(live); }
function pick(i) {
  const prev = cursorAt(tl.time).i;
  if (prev === i && user) return;
  user = { i, t: performance.now() / 1000, prev };
  tl.pause();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(live);
}
menu.addEventListener('pointerover', (e) => { const li = e.target.closest('li'); if (li) pick(Number(li.dataset.i)); });
menu.addEventListener('focusin', (e) => { const li = e.target.closest('li'); if (li) pick(Number(li.dataset.i)); });
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const i = (cursorAt(tl.time).i + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
  lis[i].querySelector('button').focus();
}, true);
const seek0 = tl.seek, play0 = tl.play;
tl.seek = (x) => { user = null; cancelAnimationFrame(raf); return seek0(x); };
tl.play = () => { user = null; cancelAnimationFrame(raf); return play0(); };
MK.expose(tl);
MK.controls(tl, { accent: '#d7141a' });
const P = MK.params();
tl.seek(P.t ?? 2.2);
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
