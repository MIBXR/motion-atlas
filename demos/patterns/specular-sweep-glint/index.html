<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>斜向扫光与星芒 · Motion Atlas</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "斜向扫光与星芒",
      "segments": [
        {
          "caseId": "mg-synthwave",
          "label": "镀铬首轮扫光",
          "from": 4.75,
          "to": 5.85
        },
        {
          "caseId": "mg-synthwave",
          "label": "镀铬末段扫光",
          "from": 7.925,
          "to": 9.8
        },
        {
          "caseId": "mg-liquid",
          "label": "厚液斜向扫光",
          "from": 6.9,
          "to": 8.0
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "镀铬首轮扫光"
        },
        {
          "t": 0.65,
          "label": "机制画面 1"
        },
        {
          "t": 1.1,
          "label": "镀铬末段扫光"
        },
        {
          "t": 2.475,
          "label": "机制画面 2"
        },
        {
          "t": 2.975,
          "label": "厚液斜向扫光"
        },
        {
          "t": 3.525,
          "label": "机制画面 3"
        }
      ],
      "reduced": 0.65,
      "root": "#stage",
      "orients": [
        "landscape"
      ],
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
