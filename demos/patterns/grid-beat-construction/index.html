<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "网格逐拍构成",
      "segments": [
        {
          "caseId": "mg-bauhaus",
          "label": "几何包豪斯",
          "from": 0,
          "to": 10
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "几何包豪斯"
        },
        {
          "t": 0.125,
          "label": "网格落笔"
        },
        {
          "t": 0.5,
          "label": "圆形落位"
        },
        {
          "t": 1.25,
          "label": "定位一"
        },
        {
          "t": 1.75,
          "label": "定位二"
        },
        {
          "t": 2.25,
          "label": "定位三"
        },
        {
          "t": 2.75,
          "label": "定位四"
        },
        {
          "t": 3,
          "label": "圆形接触"
        },
        {
          "t": 9.5,
          "label": "二十拍"
        }
      ],
      "reduced": 3,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
