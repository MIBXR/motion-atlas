<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收集计数徽章与图鉴托盘 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #f2efe8; --ink: #16171a; --muted: rgba(22,23,26,.62); --line: rgba(22,23,26,.22); --accent: #d9632b; --f-mono: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .world { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 72px 72px; opacity: .35; }
  .badge { position: absolute; right: clamp(16px, 4vw, 60px); top: clamp(24px, 8vh, 80px); display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: 0 4px 18px rgba(0,0,0,.1); transform-origin: 100% 50%; }
  .avatar { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #f7dcc8; }
  .avatar svg { width: 26px; height: 26px; }
  .avatar::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); opacity: var(--ring, 0); transform: scale(var(--ringS, 1)); }
  .label { font: 600 12px/1 var(--f-mono); letter-spacing: .2em; color: var(--muted); }
  .n { display: inline-block; height: 1.1em; overflow: hidden; font: 700 18px/1.1 var(--f-mono); }
  .n span { display: block; }
  .tray { position: absolute; right: clamp(16px, 4vw, 60px); bottom: clamp(70px, 14vh, 130px); display: flex; gap: 10px; }
  .slot { position: relative; width: clamp(64px, 7vw, 96px); aspect-ratio: 3 / 4; border-radius: 6px; border: 1.5px dashed var(--line); overflow: hidden; background: rgba(255,255,255,.4); }
  .slot .art { position: absolute; inset: 0; }
  .slot b { position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 0; text-align: center; font: 700 12px/1 var(--f-mono); letter-spacing: .1em; color: #fff; background: rgba(10,12,16,.72); }
  .slot.on { border: 2px solid var(--accent); }
  .slot .q { position: absolute; inset: 0; display: grid; place-items: center; font: 700 22px/1 var(--f-mono); color: var(--line); }
  .actions { position: absolute; left: clamp(16px, 4vw, 60px); bottom: clamp(70px, 14vh, 130px); display: flex; gap: 8px; }
  button { min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font: 600 13px/1 var(--f-mono); letter-spacing: .08em; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="world" aria-hidden="true"></div>
<div class="badge" id="badge" role="status" aria-live="polite">
  <span class="avatar"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9l4 4h12l4-4v14a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="#f3b562"/><circle cx="12.5" cy="19" r="1.6" fill="#16171a"/><circle cx="19.5" cy="19" r="1.6" fill="#16171a"/><path d="M14.5 23h3l-1.5 1.4z" fill="#d9632b"/></svg></span>
  <span class="label" id="label"></span><b class="n" id="n"></b>
</div>
<div class="tray" id="tray" aria-label="收集托盘"></div>
<div class="actions"><button type="button" id="add">+1 发现</button><button type="button" class="ghost" id="reset">重置</button></div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 ===== */
const CONFIG = {
  label: 'CAT SPOTTED',
  events: [1.0, 3.2, 5.4, 7.2], // 自动演示中计数 +1 的时刻
  slots: [
    { name: 'LAKE', colors: ['#8ea9bf', '#f2d4b6'] }, { name: 'CANAL', colors: ['#9fc2dc', '#5f7d76'] },
    { name: 'BUND', colors: ['#141a2c', '#d9406a'] }, { name: 'TEA', colors: ['#c6d2a8', '#5d7a3e'] },
  ],
  bump: 0.14, bumpDecay: 7, roll: 0.3, duration: 9,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
$('#label').textContent = CONFIG.label;
$('#tray').innerHTML = CONFIG.slots.map((s) => `<div class="slot"><span class="q">?</span><i class="art" style="background:linear-gradient(170deg,${s.colors[0]},${s.colors[1]})"></i><b>${s.name}</b></div>`).join('');
const slots = [...document.querySelectorAll('.slot')];
let extra = []; // 手动 +1 的时刻（相对时间轴）
const events = () => [...CONFIG.events, ...extra].sort((a, b) => a - b);
function render(t) {
  const ev = events().filter((x) => t >= x);
  const n = ev.length, last = ev[n - 1] ?? -9, k = t - last;
  // 徽章：数字从下方滚入；整体回弹衰减；头像外圈扩散
  const roll = MK.seg(k, 0, CONFIG.roll, MK.ease.outCubic);
  $('#n').innerHTML = `<span style="transform:translateY(${(1 - roll) * 100}%)">×${n}</span>`;
  $('#badge').style.transform = `scale(${1 + CONFIG.bump * Math.exp(-k * CONFIG.bumpDecay) * (k < 0.9 ? 1 : 0)})`;
  $('#badge').style.setProperty('--ring', k < 0.6 ? 1 - k / 0.6 : 0);
  $('#badge').style.setProperty('--ringS', 1 + k * 0.8);
  $('#badge').setAttribute('aria-label', `${CONFIG.label} ${n}`);
  slots.forEach((s, i) => {
    const at = events()[i];
    const on = at != null && t >= at;
    const p = on ? MK.seg(t, at, 0.42, MK.ease.outBack) : 0;
    s.classList.toggle('on', on);
    s.querySelector('.art').style.opacity = MK.clamp(p);
    s.querySelector('b').style.opacity = MK.clamp(p);
    s.querySelector('.q').style.opacity = on ? 0 : 1;
    s.style.transform = `scale(${on ? 0.9 + 0.1 * MK.clamp(p, 0, 1.3) : 1})`;
  });
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.events.map((t, i) => ({ t, label: `+1 · ${i + 1}` })) });
tl.on((t) => { if (t < 0.05) extra = []; });
$('#add').addEventListener('click', () => { extra.push(tl.time); render(tl.time); });
$('#reset').addEventListener('click', () => { extra = []; tl.seek(0); });
MK.expose(tl);
MK.controls(tl);
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 8 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
