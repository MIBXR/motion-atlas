<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长按确认 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #e6e6e1; --dark: #1d1f22; --yellow: #ffd400; --ok: #2fbf71; --f: "Bahnschrift","Segoe UI","Microsoft YaHei",sans-serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); font-family: var(--f); color: var(--dark); }
  .stage { position: absolute; inset: 0; display: grid; place-content: center; gap: 22px; justify-items: center; padding: 24px; }
  .btn { position: relative; width: min(80vw, 420px); min-height: 64px; border: 0; background: var(--dark); color: #fff; cursor: pointer; overflow: hidden; user-select: none; touch-action: none; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  .btn:focus-visible { outline: 3px solid var(--dark); outline-offset: 4px; box-shadow: 0 0 0 7px var(--yellow); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--yellow); }
  .lab { position: relative; font: 700 16px/1 var(--f); letter-spacing: .22em; mix-blend-mode: difference; }
  .hz { position: absolute; right: 0; top: 0; bottom: 0; width: 52px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 8px, var(--dark) 8px 16px); }
  .ring { width: 90px; height: 90px; }
  .ring circle { fill: none; stroke-width: 6; }
  .tip { font: 12px/1.6 "JetBrains Mono",Consolas,monospace; letter-spacing: .1em; color: #6b6e70; text-align: center; }
  .stamp { position: absolute; left: 50%; top: 74%; padding: 10px 18px; border: 4px solid var(--ok); color: var(--ok); font: 800 26px/1 var(--f); letter-spacing: .2em; transform: translate(-50%, -50%) rotate(-8deg); background: rgba(230,230,225,.9); pointer-events: none; }
</style>
</head>
<body>
<main class="stage">
  <svg class="ring" viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="38" stroke="#c9cbc6"/><circle id="arc" cx="45" cy="45" r="38" stroke="#1d1f22" stroke-dasharray="239 239" transform="rotate(-90 45 45)"/></svg>
  <button type="button" class="btn" id="btn" aria-describedby="tip"><i class="fill" id="fill"></i><span class="lab" id="lab">HOLD TO DEPLOY</span><span class="hz" aria-hidden="true"></span></button>
  <p class="tip" id="tip">按住按钮（或空格/回车）1.2 秒确认；中途松开会回落</p>
  <p class="stamp" id="stamp" role="status">DEPLOYED</p>
</main>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 适合不可逆操作：进度只在按住时增长，松开即以 300ms 回落；满格瞬间锁定为完成态并盖章。 */
const CONFIG = { hold: 1.2, drain: 0.3, demo: [{ start: 0.6, end: 1.2 }, { start: 2.0, end: 3.6 }], reset: 5.2, duration: 6 };
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s), sfx = MK.sound();
let live = null; // { holds: [{start, end}], t0 }
function state(t, holds) {
  let done = null, fill = 0;
  for (const h of holds) {
    if (t < h.start) break;
    const end = h.end ?? t;
    if (end - h.start >= CONFIG.hold - 1e-6) { done = h.start + CONFIG.hold; }
    if (done != null && t >= done) { fill = 1; break; }
    const reached = MK.clamp((Math.min(end, t) - h.start) / CONFIG.hold);
    fill = h.end != null && t > h.end ? reached * (1 - MK.seg(t, h.end, CONFIG.drain, MK.ease.outCubic)) : reached;
  }
  return { done: done != null && t >= done ? done : null, fill };
}
function draw(t, holds) {
  const s = state(t, holds);
  $('#fill').style.width = `${s.fill * 100}%`;
  $('#arc').style.strokeDashoffset = 239 * (1 - s.fill);
  const holding = holds.some((h) => t >= h.start && h.end == null);
  $('#lab').textContent = s.done != null ? 'DEPLOYED' : holding || (s.fill > 0 && s.fill < 1) ? `HOLDING · ${Math.round(s.fill * 100)}%` : 'HOLD TO DEPLOY';
  const k = s.done != null ? MK.seg(t, s.done, 0.35, MK.ease.outBack) : 0;
  $('#stamp').style.opacity = MK.clamp(k * 3);
  $('#stamp').style.transform = `translate(-50%, -50%) rotate(-8deg) scale(${MK.lerp(1.5, 1, MK.clamp(k, 0, 1.2))})`;
}
const tl = MK.timeline({ duration: CONFIG.duration, render: (t) => { if (!live) draw(t < CONFIG.reset ? t : 0, CONFIG.demo); }, loop: true, markers: [{ t: 0.6, label: '按住（过早松开）' }, { t: 2.0, label: '按住满 1.2s' }] });
let raf = 0;
const now = () => (performance.now() - live.t0) / 1000;
function loop() { if (!live) return; draw(now(), live.holds); raf = requestAnimationFrame(loop); }
function down(e) {
  e.preventDefault();
  if (!live) { tl.pause(); live = { holds: [], t0: performance.now() }; raf = requestAnimationFrame(loop); }
  const st = state(now(), live.holds);
  if (st.done != null) { live.holds = []; live.t0 = performance.now(); }
  live.holds.push({ start: now(), end: null });
  sfx.tone({ f: 220, d: CONFIG.hold, type: 'sawtooth', g: 0.04, slide: 660 });
}
function up() { if (live) { const h = live.holds[live.holds.length - 1]; if (h && h.end == null) h.end = now(); } }
const btn = $('#btn');
btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up);
btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.stopPropagation(); down(e); } });
btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') up(); });
const seek0 = tl.seek; tl.seek = (x) => { live = null; cancelAnimationFrame(raf); return seek0(x); };
const play0 = tl.play; tl.play = () => { live = null; cancelAnimationFrame(raf); return play0(); };
MK.expose(tl);
MK.controls(tl, { sound: sfx, accent: '#ffd400' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 3.8 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
