<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "圆点落字成标",
      "segments": [
        {
          "caseId": "mg-flat-vector",
          "label": "扁平矢量",
          "from": 7.7,
          "to": 10
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "柱帽接标"
        },
        {
          "t": 0.20000000000000018,
          "label": "柱条形变"
        },
        {
          "t": 0.4666666666666659,
          "label": "字干接替"
        },
        {
          "t": 0.5333333333333323,
          "label": "圆点升空"
        },
        {
          "t": 0.6333333333333337,
          "label": "顶点悬停"
        },
        {
          "t": 0.666666666666667,
          "label": "加速落字"
        },
        {
          "t": 0.7999999999999998,
          "label": "落字冲量"
        },
        {
          "t": 1.2999999999999998,
          "label": "首次回跳"
        },
        {
          "t": 1.7999999999999998,
          "label": "再次回跳"
        }
      ],
      "reduced": 1.7999999999999998,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
