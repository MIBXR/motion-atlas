<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逐词重拍 — Motion Atlas 巧思</title>
<style>
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: #111214; color: #f5f0e6; }
  .stage { position: absolute; inset: 0; }
  .w { position: absolute; left: 50%; top: 50%; margin: 0; white-space: nowrap; font: 800 clamp(70px, 18vw, 320px)/.9 "Bahnschrift","Arial Narrow","Segoe UI","Microsoft YaHei",sans-serif; font-stretch: 75%; letter-spacing: -.02em; }
  .ticks { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); display: flex; gap: 8px; }
  .ticks i { width: 26px; height: 6px; background: #2a2d33; }
  .ticks i.on { background: #ff4d2e; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite"><p class="w" id="w"></p><div class="ticks" id="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></div></main>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 每个词落在一个拍上：出现瞬间从 1.5 倍以 outExpo 120ms 落定（像被敲下去），持续 hold 拍后“硬切”到下一个词；
 * 反拍（+0.5 拍）给一个很小的上弹，让静止的词也跟着律动；每小节首拍换底色。 */
const CONFIG = {
  bpm: 100,
  words: [{ b: 0, w: 'EVERY' }, { b: 1, w: 'BEAT' }, { b: 2, w: 'IS A' }, { b: 3, w: 'DOOR' }, { b: 4, w: '推开' }, { b: 5, w: '下一' }, { b: 6, w: '个' }, { b: 7, w: '拍子' }],
  from: 1.5, slam: 0.12, offbeatLift: 2, colors: [['#111214', '#f5f0e6'], ['#ff4d2e', '#111214']], duration: 4.8,
};
/* ================================== */
const MK = MotionKit, BT = MK.beats(CONFIG.bpm), el = document.getElementById('w'), ticks = [...document.querySelectorAll('#ticks i')];
function render(t) {
  const beat = BT.beatOf(t);
  const cur = CONFIG.words.filter((x) => beat >= x.b).pop();
  const bar = Math.floor(beat / 4);
  const [bg, fg] = CONFIG.colors[bar % CONFIG.colors.length];
  document.body.style.background = bg; document.body.style.color = fg;
  if (!cur) { el.textContent = ''; return; }
  el.textContent = cur.w;
  const k = MK.seg(t, BT.at(cur.b), CONFIG.slam, MK.ease.outExpo);
  const into = beat - cur.b;
  const off = into >= 0.5 ? Math.exp(-(into - 0.5) * 10) : 0;
  const reduce = MK.prefersReducedMotion();
  el.style.transform = `translate(-50%, calc(-50% - ${reduce ? 0 : off * CONFIG.offbeatLift}%)) scale(${reduce ? 1 : MK.lerp(CONFIG.from, 1, k)}) rotate(${reduce ? 0 : (1 - k) * -3}deg)`;
  ticks.forEach((tk, i) => tk.classList.toggle('on', i === Math.floor(beat) % 4));
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.words.map((x) => ({ t: BT.at(x.b), label: x.w })) });
MK.expose(tl, { bpm: CONFIG.bpm });
MK.controls(tl, { accent: '#ff4d2e' });
const P = MK.params();
tl.seek(P.t ?? 0);
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
