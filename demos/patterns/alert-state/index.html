<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全局告警态切换 — Motion Atlas 巧思</title>
<style>
  :root { --main: #5ff3ff; --dim: #1d4a55; --bg: #05080b; --panel: #0a1117; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--main); font-family: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
  .wrap { position: absolute; inset: 0; padding: clamp(14px, 3vw, 40px); display: grid; grid-template-rows: auto 1fr; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px; border: 2px solid var(--main); font-size: 18px; font-weight: 700; letter-spacing: .3em; }
  .chip i { width: 14px; height: 14px; background: var(--main); }
  .btns { display: flex; gap: 8px; }
  .btns button { min-height: 40px; padding: 0 14px; border: 1px solid var(--dim); background: var(--panel); color: var(--main); font: 700 13px/1 inherit; cursor: pointer; letter-spacing: .14em; }
  .btns button[aria-pressed="true"] { border-color: var(--main); background: var(--main); color: var(--bg); }
  .btns button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .p { position: relative; border: 1px solid var(--dim); background: var(--panel); padding: 16px; overflow: hidden; }
  .p b { display: block; font-size: 12px; letter-spacing: .24em; }
  .p .v { margin-top: 10px; font-size: clamp(28px, 4vw, 56px); font-weight: 700; }
  .p .bar { margin-top: 12px; height: 8px; border: 1px solid var(--dim); position: relative; }
  .p .bar i { position: absolute; inset: 0 auto 0 0; background: var(--main); }
  .edge { position: absolute; inset: 0; pointer-events: none; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } header { flex-direction: column; gap: 12px; align-items: flex-start; } }
</style>
</head>
<body>
<div class="edge" id="edge" aria-hidden="true"></div>
<main class="wrap">
  <header><p class="chip" id="chip" role="status" style="margin:0"><i></i><span id="label">NOMINAL</span></p>
    <div class="btns" id="btns" role="group" aria-label="告警态"><button type="button" data-s="nominal">1 NOMINAL</button><button type="button" data-s="caution">2 CAUTION</button><button type="button" data-s="alert">3 ALERT</button></div></header>
  <section class="grid"><div class="p"><b>SHIELD</b><p class="v" id="v0" style="margin:0"></p><div class="bar"><i id="b0"></i></div></div><div class="p"><b>HULL</b><p class="v" id="v1" style="margin:0"></p><div class="bar"><i id="b1"></i></div></div><div class="p"><b>THREAT</b><p class="v" id="v2" style="margin:0"></p><div class="bar"><i id="b2"></i></div></div></section>
</main>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 一个“状态”同时决定：全部颜色变量（400ms 插值）、闪烁节奏（0 / 1Hz / 2Hz）、边缘辉光脉冲、数据波动幅度。
 * 组件只读 CSS 变量，不各自判断状态——切换一次，整台设备一起变。 */
const CONFIG = {
  states: {
    nominal: { label: 'NOMINAL', main: '#5ff3ff', dim: '#1d4a55', bg: '#05080b', panel: '#0a1117', hz: 0, edge: 0, jitter: 0.02 },
    caution: { label: 'CAUTION', main: '#ffb000', dim: '#5a420c', bg: '#0a0805', panel: '#14100a', hz: 1, edge: 8, jitter: 0.06 },
    alert: { label: 'ALERT', main: '#ff3b30', dim: '#5a1612', bg: '#0c0505', panel: '#170a0a', hz: 2, edge: 26, jitter: 0.16 },
  },
  script: [{ t: 0, s: 'nominal' }, { t: 2, s: 'caution' }, { t: 4.5, s: 'alert' }, { t: 7.5, s: 'nominal' }],
  colorDur: 0.4, duration: 9.5,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s), sfx = MK.sound();
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, p) => `rgb(${hex(a).map((v, i) => Math.round(MK.lerp(v, hex(b)[i], p))).join(',')})`;
let extra = [];
function render(t) {
  const ev = [...CONFIG.script, ...extra].filter((e) => t >= e.t).sort((a, b) => a.t - b.t);
  const cur = ev[ev.length - 1], prev = ev[ev.length - 2] || cur;
  const A = CONFIG.states[prev.s], B = CONFIG.states[cur.s], k = MK.seg(t, cur.t, CONFIG.colorDur, MK.ease.inOutCubic);
  for (const key of ['main', 'dim', 'bg', 'panel']) document.documentElement.style.setProperty(`--${key}`, mix(A[key], B[key], k));
  $('#label').textContent = B.label;
  const reduce = MK.prefersReducedMotion();
  $('#chip').style.opacity = reduce || !B.hz ? 1 : Math.floor(t * B.hz * 2) % 2 ? 0.25 : 1;
  const e = B.hz === 2 && !reduce ? (0.5 + 0.5 * Math.sin(t * Math.PI * 4)) * B.edge : B.edge;
  $('#edge').style.boxShadow = `inset 0 0 ${e * 2}px ${e}px ${mix(B.main, B.main, 1).replace('rgb', 'rgba').replace(')', ',.35)')}`;
  [0.92, 0.88, 0.12].forEach((base, i) => {
    const target = cur.s === 'alert' ? [0.38, 0.71, 0.86][i] : cur.s === 'caution' ? [0.74, 0.85, 0.48][i] : base;
    const v = MK.clamp(target + Math.sin(t * (7 + i * 3)) * B.jitter);
    $(`#v${i}`).textContent = `${Math.round(v * 100)}%`;
    $(`#b${i}`).style.width = `${v * 100}%`;
  });
  document.querySelectorAll('#btns button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === cur.s)));
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.script.map((s) => ({ t: s.t, label: s.s.toUpperCase() })) });
tl.on((t) => { if (t < 0.05) extra = []; });
function set(s) { extra.push({ t: tl.time, s }); sfx.tone({ f: s === 'alert' ? 520 : s === 'caution' ? 700 : 990, d: 0.3, type: 'triangle', g: 0.08 }); if (!tl.playing) render(tl.time); }
$('#btns').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set(b.dataset.s); });
addEventListener('keydown', (e) => { const m = { 1: 'nominal', 2: 'caution', 3: 'alert' }; if (m[e.key]) set(m[e.key]); });
MK.expose(tl);
MK.controls(tl, { sound: sfx, accent: '#5ff3ff' });
const P = MK.params();
tl.seek(P.t ?? 0);
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
