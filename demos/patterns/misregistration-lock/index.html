<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "套印漂移与锁版",
      "segments": [
        {
          "caseId": "mg-bauhaus",
          "label": "几何包豪斯",
          "from": 0,
          "to": 10
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "几何包豪斯"
        },
        {
          "t": 2.25,
          "label": "方块补缝"
        },
        {
          "t": 4.25,
          "label": "半圆补缝"
        },
        {
          "t": 5.5,
          "label": "红块补缝"
        },
        {
          "t": 6.5,
          "label": "色版漂开"
        },
        {
          "t": 7,
          "label": "墨吻对齐"
        },
        {
          "t": 8.5,
          "label": "定格松版"
        },
        {
          "t": 9.5,
          "label": "锁版增墨"
        }
      ],
      "reduced": 9.466666666666667,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
