<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巧思原片重放</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    #stage{background:#000}
    #cue{position:absolute;left:24px;top:24px;z-index:2;padding:10px 16px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font:22px/1.4 "Microsoft YaHei",sans-serif;pointer-events:none}
    #cue[hidden]{display:none}
  </style>
</head>
<body>
  <main id="stage"><output id="cue" hidden></output></main>
  <script src="motion-kit.js"></script>
  <script type="module">
    const config = {
      "title": "等轴引线数据卡",
      "segments": [
        {
          "caseId": "mg-isometric",
          "label": "等轴引线数据卡",
          "from": 6.1,
          "to": 8.12
        }
      ],
      "markers": [
        {
          "t": 0,
          "label": "城市运行"
        },
        {
          "t": 0.2,
          "label": "引线先行"
        },
        {
          "t": 0.4,
          "label": "能源展开"
        },
        {
          "t": 0.65,
          "label": "通勤展开"
        },
        {
          "t": 0.9,
          "label": "数据展开"
        },
        {
          "t": 1.52,
          "label": "能源收回"
        },
        {
          "t": 1.56,
          "label": "通勤收回"
        },
        {
          "t": 1.6,
          "label": "数据收回"
        },
        {
          "t": 1.82,
          "label": "卡片收齐"
        }
      ],
      "reduced": 1.4,
      "root": "#stage",
      "fps": 30
    };
    await MotionKit.replay(config);
  </script>
</body>
</html>
