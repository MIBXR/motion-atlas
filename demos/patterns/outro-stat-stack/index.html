<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结尾数据堆叠与计数 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #f2efe8; --ink: #16171a; --muted: rgba(22,23,26,.6); --accent: #d9632b;
    --f-display: "Bahnschrift","DIN Alternate","Segoe UI",sans-serif; --f-mono: "JetBrains Mono","Cascadia Mono",Consolas,monospace; --f-serif: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 72% 55%, rgba(120,150,175,.25), transparent 55%); }
  .bg svg { position: absolute; right: 6%; top: 18%; width: min(46vw, 640px); height: auto; opacity: .55; }
  .outro { position: absolute; left: clamp(20px, 7vw, 120px); top: 50%; transform: translateY(-50%); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(6px, 1.2vh, 14px); }
  li { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  li b { font: 800 clamp(34px, 5vw, 86px)/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  li span { font: 600 12px/1.3 var(--f-mono); letter-spacing: .22em; color: var(--muted); }
  .fin { margin: clamp(16px, 3vh, 32px) 0 0; font: 700 clamp(30px, 4.2vw, 72px)/1.1 var(--f-serif); }
  .fin span { display: inline-block; }
  .fin small { font: 13px/1 var(--f-mono); letter-spacing: .14em; color: var(--muted); }
  .credits { margin-top: 16px; display: grid; gap: 6px; font: 12px/1.4 var(--f-mono); letter-spacing: .08em; color: var(--muted); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 400 300"><path d="M20 260C80 200 120 230 180 170S300 120 380 40" fill="none" stroke="#16171a" stroke-width="2" stroke-dasharray="6 6"/><g fill="#fff" stroke="#16171a" stroke-width="3"><circle cx="20" cy="260" r="7"/><circle cx="180" cy="170" r="7"/><circle cx="300" cy="105" r="7"/><circle cx="380" cy="40" r="7"/></g></svg></div>
<section class="outro" aria-label="结尾统计"><ul id="stats"></ul><p class="fin"><span id="fin"></span> <small id="handle"></small></p><div class="credits" id="credits"></div></section>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 ===== */
const CONFIG = {
  stats: [
    { value: 3, label: 'DAYS · 4 CITIES' },
    { value: 4, label: 'STOPS ON THE ROUTE' },
    { value: 2, label: 'TRAVEL NOTES LEFT' },
    { value: 3, prefix: '×', label: 'CATS SPOTTED' },
    { value: 312, suffix: ' km', label: 'ON THE GROUND · +1,130 km IN THE AIR' },
  ],
  fin: '江南巡游 — fin.', handle: '@motion_atlas',
  credits: ['MUSIC · Motion Atlas Original — “Paper Lanterns”', 'POEM · 苏轼《饮湖上初晴后雨》（公有领域）'],
  t0: 0.3, stagger: 0.32, rowIn: 0.45, countDur: 0.9, finAt: 2.2, creditsAt: 3.0, duration: 7,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
$('#stats').innerHTML = CONFIG.stats.map((s) => `<li><b></b><span>${s.label}</span></li>`).join('');
const rows = [...document.querySelectorAll('#stats li')];
const fin = MK.chars(CONFIG.fin).map((c) => { const s = document.createElement('span'); s.textContent = c === ' ' ? ' ' : c; $('#fin').appendChild(s); return s; });
$('#handle').textContent = CONFIG.handle;
$('#credits').innerHTML = CONFIG.credits.map((c) => `<p style="margin:0">${c}</p>`).join('');
function render(t) {
  rows.forEach((li, i) => {
    const s = CONFIG.stats[i], st = CONFIG.t0 + i * CONFIG.stagger;
    const k = MK.seg(t, st, CONFIG.rowIn, MK.ease.outCubic);
    li.style.opacity = k;
    li.style.transform = `translateY(${(1 - k) * 14}px)`;
    // 计数用 outQuart：前段快速跳数，最后几帧放慢落定
    li.querySelector('b').textContent = `${s.prefix || ''}${MK.count(0, s.value, MK.seg(t, st, CONFIG.countDur, MK.ease.outQuart))}${s.suffix || ''}`;
  });
  fin.forEach((c, i) => { const p = MK.seg(t, CONFIG.finAt + i * 0.06, 0.5, MK.ease.outCubic); c.style.opacity = p; c.style.filter = p < 1 ? `blur(${(1 - p) * 12}px)` : 'none'; });
  $('#handle').style.opacity = MK.seg(t, CONFIG.finAt + 0.8, 0.4);
  $('#credits').style.opacity = MK.seg(t, CONFIG.creditsAt, 0.5);
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.t0, label: '统计入场' }, { t: CONFIG.finAt, label: 'fin.' }, { t: CONFIG.creditsAt, label: '致谢' }] });
MK.expose(tl);
MK.controls(tl);
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 5 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
