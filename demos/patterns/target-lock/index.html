<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阶梯式目标锁定 — Motion Atlas 巧思</title>
<style>
  :root { --main: #5ff3ff; --bg: #05080b; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--main); font-family: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
  .field { position: absolute; inset: 0; background-image: linear-gradient(rgba(95,243,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(95,243,255,.07) 1px, transparent 1px); background-size: 48px 48px; }
  .t { position: absolute; width: 16px; height: 16px; margin: -8px; border: 2px solid var(--main); transform: rotate(45deg); cursor: pointer; }
  .t:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  .ret { position: absolute; left: 0; top: 0; pointer-events: none; }
  .ret i { position: absolute; width: 18px; height: 18px; border: 3px solid var(--main); }
  .tl { left: 0; top: 0; border-right: 0 !important; border-bottom: 0 !important; } .tr { right: 0; top: 0; border-left: 0 !important; border-bottom: 0 !important; }
  .bl { left: 0; bottom: 0; border-right: 0 !important; border-top: 0 !important; } .br { right: 0; bottom: 0; border-left: 0 !important; border-top: 0 !important; }
  .lbl { position: absolute; left: calc(100% + 10px); top: 0; padding: 3px 8px; background: var(--main); color: var(--bg); font-size: 12px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
  .readout { position: absolute; left: 20px; bottom: 70px; font-size: 13px; line-height: 1.7; letter-spacing: .1em; }
  .readout b { display: inline-block; min-width: 60px; }
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<div id="targets"></div>
<div class="ret" id="ret" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="lbl" id="lbl"></span></div>
<p class="readout" id="readout" aria-live="polite"></p>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 锁定不是平滑缩放，而是分档“咔、咔、咔”收紧：每档 snap 80ms，档间停 70ms，同时从 45° 旋正；
 * 收紧完成后再等一段“确认时间”才显示 LOCK，让锁定有重量。 */
const CONFIG = {
  targets: [{ x: 0.3, y: 0.4, id: 'K-21' }, { x: 0.62, y: 0.3, id: 'X-07' }, { x: 0.72, y: 0.66, id: 'K-12' }],
  steps: [240, 180, 120, 80, 48], stepGap: 0.15, stepDur: 0.08, confirm: 1.4,
  locks: [{ t: 0.4, i: 1 }, { t: 3.2, i: 2 }, { t: 6.0, i: 0 }], duration: 8.6,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
$('#targets').innerHTML = CONFIG.targets.map((t, i) => `<button class="t" type="button" data-i="${i}" aria-label="锁定 ${t.id}" style="left:${t.x * 100}%;top:${t.y * 100}%"></button>`).join('');
let extra = [];
function render(t) {
  const locks = [...CONFIG.locks, ...extra].filter((l) => t >= l.t).sort((a, b) => a.t - b.t);
  const L = locks[locks.length - 1], ret = $('#ret');
  if (!L) { ret.style.visibility = 'hidden'; $('#readout').innerHTML = 'NO TARGET'; return; }
  const tg = CONFIG.targets[L.i], dt = t - L.t, n = CONFIG.steps.length - 1;
  const i = MK.clamp(Math.floor(dt / CONFIG.stepGap), 0, n - 1);
  const k = MK.seg(t, L.t + i * CONFIG.stepGap, CONFIG.stepDur, MK.ease.snap);
  const reduce = MK.prefersReducedMotion();
  const size = reduce ? CONFIG.steps[n] : MK.lerp(CONFIG.steps[i], CONFIG.steps[i + 1], k);
  const rot = reduce ? 0 : 45 * (1 - MK.clamp((i + k) / n));
  ret.style.visibility = 'visible';
  ret.style.left = `${tg.x * innerWidth}px`; ret.style.top = `${tg.y * innerHeight}px`;
  ret.style.width = `${size}px`; ret.style.height = `${size}px`;
  ret.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
  const locked = dt >= CONFIG.confirm;
  $('#lbl').textContent = locked ? `LOCK ${tg.id}` : `ACQ ${'■'.repeat(MK.clamp(Math.floor(dt / 0.35) + 1, 1, 4))}${'□'.repeat(4 - MK.clamp(Math.floor(dt / 0.35) + 1, 1, 4))}`;
  $('#readout').innerHTML = `<b>TARGET</b>${tg.id}<br><b>STATE</b>${locked ? 'LOCKED' : 'ACQUIRING'}<br><b>STEP</b>${i + 1} / ${n}`;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.locks.map((l) => ({ t: l.t, label: CONFIG.targets[l.i].id })) });
tl.on((t) => { if (t < 0.05) extra = []; });
$('#targets').addEventListener('click', (e) => { const b = e.target.closest('.t'); if (b) { extra.push({ t: tl.time, i: Number(b.dataset.i) }); if (!tl.playing) tl.play(); } });
MK.expose(tl);
MK.controls(tl, { accent: '#5ff3ff' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2.2 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
addEventListener('resize', () => tl.seek(tl.time));
</script>
</body>
</html>
