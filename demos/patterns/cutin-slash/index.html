<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色切入斜带 — Motion Atlas 巧思</title>
<style>
  :root { --red: #d7141a; --black: #0b0b0c; --white: #fff; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: #2a0d0e; font-family: "Arial Black",Impact,sans-serif; }
  .scene { position: absolute; inset: -30px; background: radial-gradient(ellipse at 60% 40%, #5b1416, #1a0607 70%); }
  .band { position: absolute; left: -15%; right: -15%; top: 26%; height: 36%; background: var(--black); overflow: hidden; }
  .red { position: absolute; left: 0; right: 0; top: 13%; bottom: 13%; background: var(--red); overflow: hidden; }
  .speed { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,0,0,.35) 38px 42px, transparent 42px 86px, rgba(255,255,255,.25) 86px 88px); }
  .eyes { position: absolute; left: 50%; top: 50%; width: min(78vw, 980px); transform: translate(-50%, -50%); }
  .word { position: absolute; left: 50%; top: 72%; transform: translate(-50%, -50%); display: flex; font-size: clamp(54px, 9vw, 150px); }
  .word span { display: inline-block; padding: .04em .1em; margin: 0 .02em; line-height: 1; }
  .flash { position: absolute; inset: 0; background: #fff; mix-blend-mode: difference; pointer-events: none; }
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true">
  <div class="band" id="band"><div class="red"><div class="speed" id="speed"></div>
    <svg class="eyes" id="eyes" viewBox="0 0 600 160"><path d="M60 92c70-46 170-56 230-20-70 0-150 14-230 20z" fill="#0b0b0c"/><path d="M540 92c-70-46-170-56-230-20 70 0 150 14 230 20z" fill="#0b0b0c"/><circle cx="210" cy="80" r="11" fill="#fff"/><circle cx="390" cy="80" r="11" fill="#fff"/><path d="M40 40l140 20M560 40L420 60" stroke="#0b0b0c" stroke-width="10"/></svg>
  </div></div>
  <p class="word" id="word" style="margin:0"></p>
  <div class="flash" id="flash"></div>
</div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 斜带从右侧极快切入（outExpo）→ 速度线流动、特写缓推 → 文字逐字拍入 → 斜带继续向左离场。 */
const CONFIG = {
  word: '1 MORE!', angle: -8,
  tIn: 0.3, inDur: 0.22, tWord: 0.45, stagger: 0.03, tOut: 1.9, outDur: 0.22,
  speed: 1400, pushIn: 0.12, shake: 12, duration: 3,
};
/* ================================== */
const MK = MotionKit, $ = (s) => document.querySelector(s);
const PAIRS = [['#0b0b0c', '#fff'], ['#fff', '#0b0b0c'], ['#d7141a', '#fff'], ['#fff', '#d7141a']];
const FONTS = ['"Arial Black",Impact,sans-serif', 'Georgia,serif', '"Courier New",monospace', 'Impact,sans-serif'];
const r = MK.rng(5);
const letters = MK.chars(CONFIG.word).map((ch) => {
  const s = document.createElement('span');
  if (ch === ' ') { s.style.width = '.35em'; $('#word').appendChild(s); return null; }
  const [bg, fg] = PAIRS[Math.floor(r() * PAIRS.length)];
  Object.assign(s.style, { background: bg, color: fg, fontFamily: FONTS[Math.floor(r() * FONTS.length)] });
  s.textContent = ch; $('#word').appendChild(s);
  return { s, rot: (r() - 0.5) * 18, sc: 0.9 + r() * 0.32 };
});
function render(t) {
  const cin = MK.seg(t, CONFIG.tIn, CONFIG.inDur, MK.ease.outExpo), cout = MK.seg(t, CONFIG.tOut, CONFIG.outDur, MK.ease.inCubic);
  $('#band').style.transform = `rotate(${CONFIG.angle}deg) translateX(${(1 - cin) * 120 - cout * 120}%)`;
  $('#speed').style.backgroundPosition = `${-t * CONFIG.speed}px 0`;
  $('#eyes').style.transform = `translate(-50%, -50%) scale(${1 + MK.seg(t, CONFIG.tIn, CONFIG.tOut - CONFIG.tIn, MK.ease.linear) * CONFIG.pushIn})`;
  letters.forEach((l, i) => {
    if (!l) return;
    const k = MK.seg(t, CONFIG.tWord + i * CONFIG.stagger, 0.22, MK.ease.outBack);
    l.s.style.opacity = MK.clamp(k * 4) * (1 - cout);
    l.s.style.transform = `rotate(${l.rot * (2 - k)}deg) scale(${l.sc * MK.lerp(2.2, 1, MK.clamp(k, 0, 1.2))})`;
  });
  const a = MK.prefersReducedMotion() ? 0 : (t >= CONFIG.tIn ? CONFIG.shake * Math.exp(-(t - CONFIG.tIn) * 10) : 0);
  $('#scene').style.transform = `translate(${Math.sin(t * 93) * a}px, ${Math.cos(t * 71) * a}px)`;
  $('#flash').style.opacity = t >= CONFIG.tIn && t < CONFIG.tIn + 0.06 ? 1 : 0;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: [{ t: CONFIG.tIn, label: '切入' }, { t: CONFIG.tWord, label: '文字拍入' }, { t: CONFIG.tOut, label: '离场' }] });
MK.expose(tl);
MK.controls(tl, { accent: '#d7141a' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 1.2 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
