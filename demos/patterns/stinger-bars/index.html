<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色带转场 Stinger — Motion Atlas 巧思</title>
<style>
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Bahnschrift","Segoe UI","Microsoft YaHei",sans-serif; }
  .scene { position: absolute; inset: 0; display: grid; place-items: center; font: 800 clamp(40px, 8vw, 130px)/1 "Bahnschrift","Segoe UI",sans-serif; font-style: italic; letter-spacing: -.01em; }
  .a { background: radial-gradient(ellipse at 50% 120%, #1b2c6e, #0a1230 60%); color: #fff; }
  .b { background: radial-gradient(ellipse at 50% -20%, #3d1450, #120624 60%); color: #c6ff3d; }
  .bars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .bars i { position: absolute; top: -20%; bottom: -20%; width: 34%; transform: skewX(-18deg); }
  .logo { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .logo b { padding: 10px 26px; background: #0a1230; color: #c6ff3d; font: 800 clamp(22px, 3vw, 44px)/1 "Bahnschrift",sans-serif; font-style: italic; letter-spacing: .06em; }
</style>
</head>
<body>
<section class="scene a" id="A">LIVE</section>
<section class="scene b" id="B">REPLAY</section>
<div class="bars" id="bars" aria-hidden="true"></div>
<div class="logo" aria-hidden="true"><b id="logo">VELOCITY</b></div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 多条斜色带错峰横扫：第一条盖住画面的那一拍切换场景（硬切藏在色带后面），品牌标志在色带中间闪一下。 */
const CONFIG = {
  bpm: 120, colors: ['#c6ff3d', '#29d3ff', '#ffffff', '#ff2e88', '#0a1230'],
  beats: [1, 5], lengthBeats: 2, stagger: 0.07, width: 34, skew: -18, duration: 4,
};
/* ================================== */
const MK = MotionKit, BT = MK.beats(CONFIG.bpm);
const box = document.getElementById('bars');
box.innerHTML = CONFIG.colors.map((c) => `<i style="background:${c};width:${CONFIG.width}%;transform:skewX(${CONFIG.skew}deg)"></i>`).join('');
const bars = [...box.children];
function render(t) {
  let active = null;
  CONFIG.beats.forEach((b) => { if (t >= BT.at(b)) active = b; });
  const t0 = active == null ? -9 : BT.at(active), dur = BT.spb * CONFIG.lengthBeats;
  bars.forEach((bar, i) => { bar.style.left = `${MK.lerp(-60, 160, MK.seg(t, t0 + i * CONFIG.stagger, dur, MK.ease.inOutCubic))}%`; });
  // 场景在色带覆盖中点切换：第 n 次转场后显示第 n % 2 个场景
  const swaps = CONFIG.beats.filter((b) => t >= BT.at(b) + dur * 0.5).length;
  document.getElementById('A').style.visibility = swaps % 2 ? 'hidden' : 'visible';
  document.getElementById('B').style.visibility = swaps % 2 ? 'visible' : 'hidden';
  const lk = active == null ? 0 : MK.seg(t, t0 + dur * 0.35, 0.12, MK.ease.outBack) * (1 - MK.seg(t, t0 + dur * 0.62, 0.12));
  document.getElementById('logo').style.transform = `skewX(-10deg) scale(${lk})`;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.beats.map((b, i) => ({ t: BT.at(b), label: `转场 ${i + 1}` })) });
MK.expose(tl, { bpm: CONFIG.bpm });
MK.controls(tl, { accent: '#c6ff3d' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 1.4 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
