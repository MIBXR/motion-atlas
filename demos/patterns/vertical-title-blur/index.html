<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竖排汉字模糊入场 + 英文打字 — Motion Atlas 巧思</title>
<style>
  :root { --paper: #f2efe8; --ink: #16171a; --muted: rgba(22,23,26,.6); --accent: #d9632b;
    --f-display: "Bahnschrift","DIN Alternate","Segoe UI","PingFang SC",sans-serif; --f-mono: "JetBrains Mono","Cascadia Mono",Consolas,monospace;
    --f-cjk: "Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; --f-serif: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg, var(--paper)); color: var(--fg, var(--ink)); font-family: var(--f-display); transition: none; }
  .slot { position: absolute; inset: 0; display: grid; place-items: center; visibility: hidden; }
  .title { display: flex; align-items: center; gap: clamp(14px, 2vw, 34px); }
  .cjk { writing-mode: vertical-rl; font: 900 clamp(56px, 10vw, 160px)/1 var(--f-cjk); }
  .cjk.serif { font: 700 clamp(40px, 7vw, 110px)/1.15 var(--f-serif); letter-spacing: .08em; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  .cjk span, .en span { display: inline-block; }
  .side { position: relative; padding-top: 22px; }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 3px; background: currentColor; transform-origin: 0 50%; }
  .en { margin: 0; font: 700 clamp(22px, 3.4vw, 58px)/1 var(--f-display); white-space: nowrap; letter-spacing: .02em; }
  .en.italic { font: italic 500 clamp(15px, 1.6vw, 24px)/1.4 "Inter","Segoe UI",sans-serif; white-space: normal; max-width: 24ch; }
  .meta { margin: 14px 0 0; font: 12px/1.4 var(--f-mono); letter-spacing: .16em; color: var(--muted); }
  @media (max-width: 640px) { .title { flex-direction: column; align-items: flex-start; } .en { white-space: normal; } }
</style>
</head>
<body>
<main id="stage" aria-live="polite"></main>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 ===== */
const CONFIG = {
  // 每个标题：cjk 竖排汉字；en 英文（打字）；meta 小字；style: 'title' 粗黑 | 'subtitle' 衬线白字
  items: [
    { t: 0.2, dur: 3.6, cjk: '江南巡游', en: "JIANGNAN WALK '26", meta: 'BEIJING → HANGZHOU → SUZHOU → SHANGHAI', style: 'title' },
    { t: 4.2, dur: 3.4, cjk: '杭州', en: 'HANGZHOU · WEST LAKE', meta: '30.2427°N 120.1446°E', style: 'title' },
    { t: 8.0, dur: 3.6, cjk: '欲把西湖比西子', en: 'Compare West Lake to Xi Shi, the beauty of old.', style: 'subtitle', bg: '#14202c', fg: '#ffffff' },
  ],
  charStagger: 0.14, // 字间错峰（秒）
  charDur: 0.5,      // 单字入场时长
  blur: 14,          // 初始模糊（px）
  rise: 10,          // 初始上移（px）
  typeSpeed: 0.045,  // 英文每字符（秒）
  duration: 12,
};
/* ================================== */
const MK = MotionKit, stage = document.getElementById('stage');
const split = (el, text) => MK.chars(text).map((c) => { const s = document.createElement('span'); s.textContent = c === ' ' ? ' ' : c; el.appendChild(s); return s; });
const slots = CONFIG.items.map((it) => {
  const el = document.createElement('section');
  el.className = 'slot';
  el.innerHTML = `<div class="title"><div class="cjk${it.style === 'subtitle' ? ' serif' : ''}"></div><div class="side">${it.style === 'title' ? '<i class="rule"></i>' : ''}<p class="en${it.style === 'subtitle' ? ' italic' : ''}"></p>${it.meta ? `<p class="meta">${it.meta}</p>` : ''}</div></div>`;
  stage.appendChild(el);
  return { it, el, cjk: split(el.querySelector('.cjk'), it.cjk), en: split(el.querySelector('.en'), it.en), rule: el.querySelector('.rule'), meta: el.querySelector('.meta') };
});
function render(t) {
  let bg = '', fg = '';
  for (const s of slots) {
    const { it } = s;
    const vis = MK.env(t, it.t, it.t + it.dur, 0.01, 0.45);
    s.el.style.visibility = vis > 0 ? 'visible' : 'hidden';
    s.el.style.opacity = vis;
    s.el.style.filter = t > it.t + it.dur ? `blur(${MK.seg(t, it.t + it.dur, 0.45) * 10}px)` : 'none';
    if (vis > 0 && it.bg) { bg = it.bg; fg = it.fg; }
    // 汉字：自上而下逐字，模糊 → 清晰、上移 → 归位
    s.cjk.forEach((c, i) => {
      const p = MK.seg(t, it.t + i * CONFIG.charStagger, CONFIG.charDur, MK.ease.outCubic);
      c.style.opacity = p;
      c.style.filter = p < 1 ? `blur(${(1 - p) * CONFIG.blur}px)` : 'none';
      c.style.transform = `translateY(${(1 - p) * -CONFIG.rise}px)`;
    });
    if (s.rule) s.rule.style.transform = `scaleX(${MK.seg(t, it.t + 0.45, 0.45, MK.ease.outCubic)})`;
    // 英文：打字推进，前沿 2 个字符模糊
    const start = it.t + (it.style === 'subtitle' ? 0.6 : 0.7);
    const head = MK.clamp((t - start) / (s.en.length * CONFIG.typeSpeed)) * (s.en.length + 2);
    s.en.forEach((c, i) => { const k = MK.clamp(head - i); c.style.opacity = k; c.style.filter = k > 0 && k < 1 ? `blur(${(1 - k) * 6}px)` : 'none'; });
    if (s.meta) s.meta.style.opacity = MK.seg(t, it.t + 1.5, 0.5);
  }
  document.body.style.setProperty('--bg', bg || 'var(--paper)');
  document.body.style.setProperty('--fg', fg || 'var(--ink)');
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.items.map((it, i) => ({ t: it.t, label: `标题 ${i + 1}` })) });
MK.expose(tl);
MK.controls(tl, { accent: '#d9632b' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 2.5 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
