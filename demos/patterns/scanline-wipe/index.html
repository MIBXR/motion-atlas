<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫描线换页 — Motion Atlas 巧思</title>
<style>
  :root { --dark: #1d1f22; --panel: #f4f4f0; --yellow: #ffd400; --f: "Bahnschrift","Segoe UI","Microsoft YaHei",sans-serif; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e6e1; font-family: var(--f); color: var(--dark); }
  .frame { position: absolute; inset: clamp(16px, 4vw, 60px); background: var(--panel); overflow: hidden; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .view { position: absolute; inset: 0; padding: clamp(20px, 3vw, 40px); display: grid; align-content: start; gap: 14px; }
  .k { font: 600 12px/1 "JetBrains Mono",Consolas,monospace; letter-spacing: .18em; color: #6b6e70; }
  h1 { margin: 0; font: 700 clamp(26px, 4vw, 56px)/1 var(--f); letter-spacing: .04em; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .cards i { height: clamp(80px, 18vh, 180px); background: var(--dark); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
  .v2 .cards i { background: #c9cbc6; }
  .v3 .cards i { background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, var(--dark) 10px 20px); }
  .line { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--yellow); box-shadow: 0 0 0 1px rgba(29,31,34,.4), 0 0 26px 7px rgba(255,212,0,.45); pointer-events: none; }
  .ghost { position: absolute; top: 0; bottom: 0; width: 18%; background: linear-gradient(90deg, transparent, rgba(255,212,0,.12)); pointer-events: none; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <section class="view v1"><p class="k">MODULE 01</p><h1>FACTORY</h1><div class="cards"><i></i><i></i><i></i></div></section>
  <section class="view v2"><p class="k">MODULE 02</p><h1>OPERATORS</h1><div class="cards"><i></i><i></i><i></i></div></section>
  <section class="view v3"><p class="k">MODULE 03</p><h1>DEPOT</h1><div class="cards"><i></i><i></i><i></i></div></section>
  <i class="ghost" id="ghost"></i><i class="line" id="line"></i>
</div>
<script src="motion-kit.js"></script>
<script>
/* ===== CONFIG：改这里即可迁移 =====
 * 换页时一条发光扫描线从左扫到右：线左侧是新页（clip-path 右侧裁切），线右侧仍是旧页（左侧裁切）；
 * 新页的卡片在扫描线经过后以 snap 错峰上浮。 */
const CONFIG = { switches: [0.6, 2.4, 4.2], sweep: 0.5, ease: 'inOutQuart', cardStagger: 0.06, duration: 6 };
/* ================================== */
const MK = MotionKit;
const views = [...document.querySelectorAll('.view')];
function render(t) {
  let cur = 0, prev = 0, ts = -9;
  CONFIG.switches.forEach((s, i) => { if (t >= s) { prev = cur; cur = (i + 1) % views.length; ts = s; } });
  const x = MK.seg(t, ts, CONFIG.sweep, MK.ease[CONFIG.ease]);
  const sweeping = t >= ts && t < ts + CONFIG.sweep;
  views.forEach((v, i) => {
    if (i === cur) { v.style.visibility = 'visible'; v.style.clipPath = sweeping ? `inset(0 ${(1 - x) * 100}% 0 0)` : 'none'; }
    else if (sweeping && i === prev) { v.style.visibility = 'visible'; v.style.clipPath = `inset(0 0 0 ${x * 100}%)`; }
    else v.style.visibility = 'hidden';
    v.querySelectorAll('.cards i').forEach((c, j) => { const k = i === cur ? MK.seg(t, ts + CONFIG.sweep * 0.5 + j * CONFIG.cardStagger, 0.32, MK.ease.snap) : 1; c.style.transform = `translateY(${(1 - k) * 18}px)`; });
  });
  document.getElementById('line').style.left = `${x * 100}%`;
  document.getElementById('line').style.opacity = sweeping ? 1 : 0;
  document.getElementById('ghost').style.left = `calc(${x * 100}% - 18%)`;
  document.getElementById('ghost').style.opacity = sweeping ? 1 : 0;
}
const tl = MK.timeline({ duration: CONFIG.duration, render, loop: true, markers: CONFIG.switches.map((s, i) => ({ t: s, label: `换页 ${i + 1}` })) });
MK.expose(tl);
MK.controls(tl, { accent: '#ffd400' });
const P = MK.params();
tl.seek(P.t ?? (MK.prefersReducedMotion() ? 1.4 : 0));
if (P.autoplay && !MK.prefersReducedMotion()) tl.play();
</script>
</body>
</html>
