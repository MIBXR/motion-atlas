<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>舞台模板 · Stage Template — Motion Atlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    案例模板（不是条目，不进入站点）。迁移约定：
    - 舞台根节点 #stage 由 MotionKit.stage() 固定为 1920×1080 / 1080×1920 并整体等比缩放；内部一律用像素。
    - 层级从下到上：背景 → 图形（SVG） → 文字 → HUD → 转场 / 收尾 → 质感。
    - 真正的条目 Demo 引用同目录的 motion-kit.js（构建时同步）；模板直接引用 kit 源文件。
  -->
  <main id="stage" class="stage" aria-label="舞台模板：固定画幅、乐谱声音与预加载">
    <div class="bg" aria-hidden="true"></div>
    <svg class="gfx" id="gfx" aria-hidden="true"></svg>
    <div class="txt">
      <p class="kicker" id="kicker"></p>
      <h1 class="title" id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="labels" id="labels"></div>
      <div class="readout" id="readout"><small>BPM 120</small><b id="rdNum">00</b><small>BEAT</small></div>
    </div>
    <div class="hud" aria-hidden="true">
      <i class="corner c-tl"></i><i class="corner c-tr"></i><i class="corner c-bl"></i><i class="corner c-br"></i>
      <p class="brand"><img id="mark" alt=""><span>MOTION ATLAS · TEMPLATE</span></p>
      <p class="tc" id="tc">00:00.00</p>
      <p class="fmt" id="fmt"></p>
      <p class="sq" id="sq"><i></i><i></i><i></i><i></i></p>
    </div>
    <div class="wipe" id="wipe" aria-hidden="true"></div>
    <section class="endcard" id="endcard" aria-hidden="true">
      <p class="ec-title" id="ecTitle"></p>
      <p class="ec-en" id="ecEn"></p>
      <p class="ec-stamp" id="ecStamp"></p>
    </section>
    <div class="grain" id="grain" aria-hidden="true"></div>
  </main>
  <script src="../../../kit/motion-kit.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
