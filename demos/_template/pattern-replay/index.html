<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>片段重放模板 · Motion Atlas</title>
</head>
<body>
  <main id="stage"></main>
  <script src="../../../kit/motion-kit.js"></script>
  <script type="module">
    MotionKit.replay({

    });
  </script>
</body>
